name: Nautilus Real-T2 Acquisition

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed implementation head to acquire against
        required: true
        type: string

permissions:
  contents: read

jobs:
  bounded-real-t2:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0

      - name: Assert exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_head }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen project
        run: python -m pip install -e '.[dev]'

      - name: Public-only credential-negative gate
        run: python - <<'PY'
          import os
          from trader_assist_v0.nautilus_e4.safety import assert_public_only
          assert_public_only(env=os.environ)
          PY

      - name: Single fixed 14400-second acquisition attempt
        run: |
          python scripts/nautilus_vnext_g4_real_t2_acquisition.py             --evidence-root artifacts/task5d-real-t2             --result-path artifacts/task5d-real-t2-result.json             --expected-head "${{ inputs.expected_head }}"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task5d-real-t2-${{ inputs.expected_head }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
