name: R3 Connector Recovery Helper

on:
  push:
    branches:
      - governance/local-git-transport-fallback-20260917
    paths:
      - .github/workflows/r3-connector-recovery.yml

permissions:
  contents: write

jobs:
  recover-and-amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: governance/local-git-transport-fallback-20260917
          fetch-depth: 0
      - name: Execute file-backed recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/r3_recovery_helper.py
