name: Nautilus RC7 unified native
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc7-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify official wheel and isolated native API
        run: |
          python scripts/rc7/official_smoke.py --output /tmp/rc7-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-native-proof
          path: /tmp/rc7-proof
