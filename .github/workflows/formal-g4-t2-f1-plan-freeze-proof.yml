name: Formal G4 T2 F1 Plan Freeze Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/formal-g4-t2-f1-plan-freeze-proof.yml"

permissions:
  contents: read

jobs:
  f1-plan-freeze:
    if: github.head_ref == 'engineering/f1-plan-freeze-proof-20260918'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: cb8109b92b37ca4fb85fdce3f95a1bf8954589c4
      TARGET_TREE: a16075d4cc32c841ce4c207b072a86c1a24c01f8
      EXPECTED_MARKET_ID: 7df4530dee44516e601335ea792c74c1186be88238452edc1f75bafd8257e605
      EXPECTED_INSTRUMENT_ID: BTC-USD-PERP.HYPERLIQUID
      EXPECTED_BAR_TYPE: BTC-USD-PERP.HYPERLIQUID-5-MINUTE-LAST-EXTERNAL
      NAUTILUS_VERSION: 2.0.0rc5
      NAUTILUS_UPSTREAM_COMMIT: 1b0a49d2792a9432a3aca3fcb617ce7a630d905e
      F1_PLAN_DIR: ${{ runner.temp }}/formal-g4-t2-f1-plan

    steps:
      - name: Checkout exact target base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock

      - name: Exact hashed rc5 environment
        run: |
          python -m venv /tmp/trader-assist-f1-plan-venv
          /tmp/trader-assist-f1-plan-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-f1-plan-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-f1-plan-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation

      - name: Exact source and dependency preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${TARGET_TREE}"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          /tmp/trader-assist-f1-plan-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-f1-plan-venv/bin/python -m pip check
          /tmp/trader-assist-f1-plan-venv/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("nautilus-trader") == "2.0.0rc5"
          PY

      - name: Freeze exact BTC F1 acquisition plan
        id: freeze
        continue-on-error: true
        env:
          PROOF_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
          PROOF_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          mkdir -p "${F1_PLAN_DIR}"
          /tmp/trader-assist-f1-plan-venv/bin/python - <<'PY' \
            > "${F1_PLAN_DIR}/builder.stdout" \
            2> "${F1_PLAN_DIR}/builder.stderr"
          from __future__ import annotations

          import json
          import os
          import time
          from datetime import UTC, datetime
          from pathlib import Path

          from trader_assist_v0.contracts.common import canonical_json_bytes, sha256_hex
          from trader_assist_v0.multi_asset_shadow.hyperliquid_public import HyperliquidPublicClient
          from trader_assist_v0.multi_asset_shadow.resolution import resolve_first_launch_20
          from trader_assist_v0.nautilus_e4.contracts import MarketExpression, PitUniverseSnapshot, RunManifest
          from trader_assist_v0.nautilus_e4.safety import assert_public_only

          TARGET_SHA = os.environ["TARGET_SHA"]
          TARGET_TREE = os.environ["TARGET_TREE"]
          EXPECTED_MARKET_ID = os.environ["EXPECTED_MARKET_ID"]
          EXPECTED_INSTRUMENT_ID = os.environ["EXPECTED_INSTRUMENT_ID"]
          EXPECTED_BAR_TYPE = os.environ["EXPECTED_BAR_TYPE"]
          NAUTILUS_VERSION = os.environ["NAUTILUS_VERSION"]
          NAUTILUS_UPSTREAM_COMMIT = os.environ["NAUTILUS_UPSTREAM_COMMIT"]
          PROOF_WORKFLOW_HEAD = os.environ["PROOF_WORKFLOW_HEAD"]
          PROOF_PR_NUMBER = int(os.environ["PROOF_PR_NUMBER"])
          OUT = Path(os.environ["F1_PLAN_DIR"])

          PLAN_DOMAIN = b"trader-assist-v0/g4/t2-acquisition-plan/v1\0"
          FIVE_MINUTES_MS = 300_000
          WARMUP_5M_BARS = 2304
          HISTORY_PAGE_SIZE_MAX = 500

          assert_public_only(env=os.environ)

          client = HyperliquidPublicClient()
          perp_dexes = client.perp_dexes()
          all_perp_metas = client.all_perp_metas()

          observed_at = datetime.now(UTC)
          observed_at_ns = time.time_ns()
          resolutions = resolve_first_launch_20(
              perp_dexes=perp_dexes,
              all_perp_metas=all_perp_metas,
              observed_at=observed_at,
          )
          btc_matches = [item for item in resolutions if item.request.display == "BTC"]
          if len(btc_matches) != 1:
              raise RuntimeError("BTC resolution cardinality is not exactly one")
          btc = btc_matches[0]
          if btc.status != "RESOLVED" or btc.market is None:
              raise RuntimeError(f"BTC official metadata resolution failed: {btc.status}")
          market = btc.market

          if market.identity.dex != "MAIN" or market.identity.coin != "BTC":
              raise RuntimeError("BTC official metadata identity drifted from MAIN/BTC")
          if market.identity.market_id != EXPECTED_MARKET_ID:
              raise RuntimeError("BTC market_id conflicts with frozen Market/Venue authority")

          metadata_version = f"HL_MAIN_BTC_META_{market.metadata_hash[:16]}"
          expression_id = f"mvsf-f1-btc-main-{market.metadata_hash[:16]}"
          expression = MarketExpression(
              market_id=market.identity.market_id,
              dex="MAIN",
              provider_coin="BTC",
              instrument_id=EXPECTED_INSTRUMENT_ID,
              expression_id=expression_id,
              listing_state=market.market_status,
              instrument_metadata_version=metadata_version,
              instrument_metadata_hash=market.metadata_hash,
          )

          snapshot = PitUniverseSnapshot.create(
              observed_at_ns=observed_at_ns,
              expressions=(expression,),
          )
          manifest = RunManifest.create(
              run_id=f"t2-f1-btc-{snapshot.snapshot_hash[:16]}",
              git_sha=TARGET_SHA,
              git_tree=TARGET_TREE,
              snapshot=snapshot,
              process_epoch=f"t2f1-process-{snapshot.snapshot_hash[:16]}",
              continuity_epoch=f"t2f1-continuity-{snapshot.snapshot_hash[:16]}",
              admission_epoch=f"t2f1-admission-{snapshot.snapshot_hash[:16]}",
              capture_configuration={
                  "purpose": "FORMAL_G4_FIRST_REAL_T2_F1",
                  "market_selection_owner": "MARKET_AND_VENUE_SELECTION",
                  "selection_freeze_comment": 5726539966,
                  "identity_correction_comment": 5726758424,
                  "proof_workflow_head": PROOF_WORKFLOW_HEAD,
                  "proof_pr_number": PROOF_PR_NUMBER,
                  "expressions": [expression.model_dump(mode="json")],
                  "public_metadata_only_at_plan_freeze": True,
              },
              subscription_policy={
                  "discovery": [expression.market_id],
                  "watch": [],
                  "actionable": [expression.market_id],
              },
              trial_ledger_id="formal-g4-first-real-t2-f1-btc-v1",
          )

          now_ms = time.time_ns() // 1_000_000
          current_boundary_ms = (now_ms // FIVE_MINUTES_MS) * FIVE_MINUTES_MS
          history_end_ms = current_boundary_ms - FIVE_MINUTES_MS
          if history_end_ms <= WARMUP_5M_BARS * FIVE_MINUTES_MS:
              raise RuntimeError("history_end_ms is too early for required warmup")

          first = history_end_ms - WARMUP_5M_BARS * FIVE_MINUTES_MS
          pages = []
          cursor = first
          remaining = WARMUP_5M_BARS
          while remaining:
              count = min(HISTORY_PAGE_SIZE_MAX, remaining)
              end = cursor + count * FIVE_MINUTES_MS
              pages.append(
                  {
                      "page_index": len(pages),
                      "start_ms": cursor,
                      "end_ms": end,
                      "expected_count": count,
                  }
              )
              cursor = end
              remaining -= count

          if [page["expected_count"] for page in pages] != [500, 500, 500, 500, 304]:
              raise RuntimeError("unexpected conservative 500-page ledger")
          for left, right in zip(pages, pages[1:], strict=False):
              if left["end_ms"] != right["start_ms"]:
                  raise RuntimeError("page ledger contains gap or overlap")

          plan_payload = {
              "schema_version": "VNEXT_G4_T2_ACQUISITION_PLAN_V1",
              "nautilus_version": NAUTILUS_VERSION,
              "nautilus_upstream_commit": NAUTILUS_UPSTREAM_COMMIT,
              "history_5m_required": WARMUP_5M_BARS,
              "history_page_size_max": HISTORY_PAGE_SIZE_MAX,
              "redundant_15m_1h_requests": False,
              "git_sha": TARGET_SHA,
              "git_tree": TARGET_TREE,
              "source_e4_manifest_hash": manifest.manifest_hash,
              "source_pit_snapshot_hash": snapshot.snapshot_hash,
              "market_id": expression.market_id,
              "expression_id": expression.expression_id,
              "instrument_id": expression.instrument_id,
              "instrument_metadata_version": expression.instrument_metadata_version,
              "instrument_metadata_hash": expression.instrument_metadata_hash,
              "bar_type": EXPECTED_BAR_TYPE,
              "pages": pages,
          }
          acquisition_plan_hash = sha256_hex(
              PLAN_DOMAIN + canonical_json_bytes(plan_payload)
          )
          plan = {
              **plan_payload,
              "acquisition_plan_hash": acquisition_plan_hash,
          }

          provider_evidence = {
              "schema_version": "T2_F1_PROVIDER_METADATA_EVIDENCE_V2",
              "observed_at": observed_at.isoformat(),
              "proof_workflow_head": PROOF_WORKFLOW_HEAD,
              "proof_pr_number": PROOF_PR_NUMBER,
              "requests_performed": ["perpDexs", "allPerpMetas"],
              "perp_dexes_hash": sha256_hex(canonical_json_bytes(perp_dexes)),
              "all_perp_metas_hash": sha256_hex(canonical_json_bytes(all_perp_metas)),
              "selected_registry_market": market.model_dump(mode="json"),
              "selected_market_metadata_hash": market.metadata_hash,
              "candle_requests": 0,
              "l2_requests": 0,
              "trade_streams": 0,
              "setup_observation": 0,
              "outcome_observation": 0,
              "private_api": False,
              "credentials": False,
              "signing": False,
              "exchange_write": False,
          }

          authority = {
              "schema_version": "TRADE_OS_T2_F1_MARKET_VENUE_PLAN_CHECKPOINT_V3_GITHUB_ACTIONS",
              "contract_closure_review_comment": 5726453814,
              "selection_freeze_comment": 5726539966,
              "command_audit_comment": 5726758424,
              "owner_domain": "MARKET_AND_VENUE_SELECTION",
              "selected_underlying": "BTC",
              "selected_venue": "HYPERLIQUID",
              "selected_dex": "MAIN",
              "selected_provider_coin": "BTC",
              "selection_frozen_before_history_or_setup_observation": True,
              "post_hoc_market_substitution": False,
              "git_sha": TARGET_SHA,
              "git_tree": TARGET_TREE,
              "nautilus_version": NAUTILUS_VERSION,
              "nautilus_upstream_commit": NAUTILUS_UPSTREAM_COMMIT,
              "source_e4_manifest_hash": manifest.manifest_hash,
              "source_pit_snapshot_hash": snapshot.snapshot_hash,
              "market_id": expression.market_id,
              "expression_id": expression.expression_id,
              "instrument_id": expression.instrument_id,
              "instrument_metadata_version": expression.instrument_metadata_version,
              "instrument_metadata_hash": expression.instrument_metadata_hash,
              "bar_type": EXPECTED_BAR_TYPE,
              "history_end_ms": history_end_ms,
              "exact_2304x5m_page_ledger": pages,
              "acquisition_plan_hash": acquisition_plan_hash,
              "proof_workflow_head": PROOF_WORKFLOW_HEAD,
              "proof_pr_number": PROOF_PR_NUMBER,
          }

          files = {
              "f1_market_authority_checkpoint.json": authority,
              "f1_acquisition_plan.json": plan,
              "f1_pit_snapshot.json": snapshot.model_dump(mode="json"),
              "f1_e4_run_manifest.json": manifest.model_dump(mode="json"),
              "f1_provider_metadata_evidence.json": provider_evidence,
          }
          for name, payload in files.items():
              (OUT / name).write_bytes(canonical_json_bytes(payload) + b"\n")

          summary = {
              "F1_PLAN_FREEZE": "PASS",
              "target_sha": TARGET_SHA,
              "target_tree": TARGET_TREE,
              "market_id": expression.market_id,
              "instrument_id": expression.instrument_id,
              "bar_type": EXPECTED_BAR_TYPE,
              "metadata_hash": expression.instrument_metadata_hash,
              "pit_snapshot_hash": snapshot.snapshot_hash,
              "e4_manifest_hash": manifest.manifest_hash,
              "acquisition_plan_hash": acquisition_plan_hash,
              "history_end_ms": history_end_ms,
              "page_counts": [page["expected_count"] for page in pages],
              "proof_workflow_head": PROOF_WORKFLOW_HEAD,
              "proof_pr_number": PROOF_PR_NUMBER,
          }
          (OUT / "summary.json").write_bytes(canonical_json_bytes(summary) + b"\n")
          print(json.dumps(summary, sort_keys=True))
          PY
          rc=$?
          printf '%s\n' "${rc}" > "${F1_PLAN_DIR}/builder.exit_code"
          cat "${F1_PLAN_DIR}/builder.stdout" || true
          cat "${F1_PLAN_DIR}/builder.stderr" >&2 || true
          exit "${rc}"

      - name: Assert exact plan contract
        if: always()
        run: |
          set -euo pipefail
          test -f "${F1_PLAN_DIR}/builder.exit_code"
          test "$(cat "${F1_PLAN_DIR}/builder.exit_code")" = "0"
          /tmp/trader-assist-f1-plan-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          from trader_assist_v0.contracts.common import canonical_json_bytes, sha256_hex
          from trader_assist_v0.nautilus_e4.contracts import PitUniverseSnapshot, RunManifest

          out = Path(os.environ["F1_PLAN_DIR"])
          domain = b"trader-assist-v0/g4/t2-acquisition-plan/v1\0"

          plan = json.loads((out / "f1_acquisition_plan.json").read_text())
          supplied_hash = plan.pop("acquisition_plan_hash")
          assert sha256_hex(domain + canonical_json_bytes(plan)) == supplied_hash
          plan["acquisition_plan_hash"] = supplied_hash

          assert plan["git_sha"] == os.environ["TARGET_SHA"]
          assert plan["git_tree"] == os.environ["TARGET_TREE"]
          assert plan["nautilus_version"] == "2.0.0rc5"
          assert plan["nautilus_upstream_commit"] == os.environ["NAUTILUS_UPSTREAM_COMMIT"]
          assert plan["market_id"] == os.environ["EXPECTED_MARKET_ID"]
          assert plan["instrument_id"] == os.environ["EXPECTED_INSTRUMENT_ID"]
          assert plan["bar_type"] == os.environ["EXPECTED_BAR_TYPE"]
          assert plan["history_5m_required"] == 2304
          assert plan["history_page_size_max"] == 500
          assert plan["redundant_15m_1h_requests"] is False
          assert [p["expected_count"] for p in plan["pages"]] == [500, 500, 500, 500, 304]
          assert sum(p["expected_count"] for p in plan["pages"]) == 2304
          assert all(
              left["end_ms"] == right["start_ms"]
              for left, right in zip(plan["pages"], plan["pages"][1:])
          )

          snapshot = PitUniverseSnapshot.model_validate_json(
              (out / "f1_pit_snapshot.json").read_bytes()
          )
          manifest = RunManifest.model_validate_json(
              (out / "f1_e4_run_manifest.json").read_bytes()
          )
          assert snapshot.snapshot_hash == plan["source_pit_snapshot_hash"]
          assert manifest.manifest_hash == plan["source_e4_manifest_hash"]
          assert manifest.git_sha == plan["git_sha"]
          assert manifest.git_tree == plan["git_tree"]
          assert manifest.pit_snapshot_hash == snapshot.snapshot_hash
          assert manifest.subscription_policy["discovery"] == [plan["market_id"]]
          assert manifest.subscription_policy["watch"] == []
          assert manifest.subscription_policy["actionable"] == [plan["market_id"]]

          evidence = json.loads((out / "f1_provider_metadata_evidence.json").read_text())
          assert evidence["requests_performed"] == ["perpDexs", "allPerpMetas"]
          assert evidence["candle_requests"] == 0
          assert evidence["l2_requests"] == 0
          assert evidence["trade_streams"] == 0
          assert evidence["setup_observation"] == 0
          assert evidence["outcome_observation"] == 0
          assert evidence["private_api"] is False
          assert evidence["credentials"] is False
          assert evidence["signing"] is False
          assert evidence["exchange_write"] is False

          summary = json.loads((out / "summary.json").read_text())
          assert summary["F1_PLAN_FREEZE"] == "PASS"
          assert summary["acquisition_plan_hash"] == supplied_hash
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Preserve exact F1 plan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-g4-t2-f1-plan-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/formal-g4-t2-f1-plan
          if-no-files-found: error
          retention-days: 14
