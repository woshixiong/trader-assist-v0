name: Nautilus VNext G4 CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      representative_capture:
        description: Run one fixed prospective representative public capture
        required: false
        type: boolean
        default: false
      formal_g4_finalize:
        description: Run fail-closed Formal G4 finalization on this exact reviewed head
        required: false
        type: boolean
        default: false
      expected_exact_head:
        description: Full exact Git head authorized for the selected dispatch mode
        required: false
        type: string
        default: ""
      authoritative_e4_ci_run_id:
        description: Successful exact-head pull-request CI run proving G4E6
        required: false
        type: string
        default: ""
      canonical_g4e8_reattestation_comment_id:
        description: Owner same-head G4E8 re-attestation comment ID
        required: false
        type: string
        default: ""
      canonical_t2_acceptance_comment_id:
        description: Owner canonical Rooted-T2 acceptance comment ID
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  vnext-g4:
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (!inputs.representative_capture && !inputs.formal_g4_finalize) }}
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_G4_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock
      - name: Exact hashed rc5 environment
        run: |
          python -m venv /tmp/trader-assist-g4-venv
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
      - name: Dependency and exact rc5 identity
        run: |
          /tmp/trader-assist-g4-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-g4-venv/bin/python -m pip check
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("nautilus-trader") == "2.0.0rc5"
          PY
      - name: Focused G4 deterministic gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_vnext_g4_t2_shadow.py \
            tests/test_vnext_g4_contracts.py \
            tests/test_vnext_g4_evaluator.py \
            tests/test_vnext_g4_reporting.py \
            tests/test_nautilus_vnext_g4_catalog_bridge.py \
            tests/test_nautilus_vnext_g4_runner.py \
            tests/test_nautilus_vnext_g4_qualification.py \
            tests/test_nautilus_vnext_g4_formal_closure.py \
            tests/test_nautilus_vnext_g4_representative_scale.py \
            tests/test_nautilus_vnext_g4_representative_acquisition.py
      - name: E4 source-authority regressions
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_e4_contracts.py \
            tests/test_nautilus_e4_capture.py
      - name: E3 structural-reference regressions
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_pilot_contracts.py
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_pilot_version_contract.py
      - name: Static gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m ruff check \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_t2_shadow.py \
            scripts/nautilus_vnext_g4_qualification.py \
            scripts/nautilus_vnext_g4_representative_scale.py \
            scripts/nautilus_vnext_g4_representative_acquisition.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          /tmp/trader-assist-g4-venv/bin/python -m mypy \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_t2_shadow.py \
            scripts/nautilus_vnext_g4_qualification.py \
            scripts/nautilus_vnext_g4_representative_scale.py \
            scripts/nautilus_vnext_g4_representative_acquisition.py
          /tmp/trader-assist-g4-venv/bin/python -m compileall -q \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_t2_shadow.py \
            scripts/nautilus_vnext_g4_qualification.py \
            scripts/nautilus_vnext_g4_representative_scale.py \
            scripts/nautilus_vnext_g4_representative_acquisition.py \
            .github/spikes/t2_rc5_capability_spike.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          test "$(sha256sum src/trader_assist_v0/vnext_g4/evaluator.py | cut -d' ' -f1)" = \
            "63e44fcefdbb714267a293e823aa5114bc705a5f220b1db3834f4706521a4c18"
          git diff --check
      - name: Exact-head rc5 two-phase capability spike
        id: t2_rc5_capability_spike
        timeout-minutes: 5
        run: |
          /tmp/trader-assist-g4-venv/bin/python \
            .github/spikes/t2_rc5_capability_spike.py \
            --evidence-root "${RUNNER_TEMP}/t2-rc5-capability-spike-evidence" \
            --result-path "${RUNNER_TEMP}/t2-rc5-capability-spike-evidence/result.json"
      - name: Preserve exact-head rc5 capability-spike evidence
        if: ${{ always() && steps.t2_rc5_capability_spike.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-rc5-capability-spike-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/t2-rc5-capability-spike-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Assert exact-head typed rc5 capability evidence
        env:
          T2_RESULT: ${{ runner.temp }}/t2-rc5-capability-spike-evidence/result.json
        run: |
          T2_EXPECTED_HEAD="$(git rev-parse HEAD)" \
          T2_EXPECTED_TREE="$(git rev-parse 'HEAD^{tree}')" \
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["T2_RESULT"]).read_text())
          assert result["schema_version"] == "T2_RC5_CAPABILITY_SPIKE_V2", result
          assert result["status"] == "PASS", result
          assert result["exact_git_head"] == os.environ["T2_EXPECTED_HEAD"], result
          assert result["exact_git_tree"] == os.environ["T2_EXPECTED_TREE"], result
          assert result["nautilus_version"] == "2.0.0rc5", result
          assert result["task_packet_sha256"] == (
              "df432697ba3083dec3542002f5771733c09c1b8f250da85ee7a2ca817084bfa9"
          ), result
          canonical_packet = json.dumps(
              result["task_packet_identity"],
              ensure_ascii=True,
              allow_nan=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode()
          assert hashlib.sha256(canonical_packet).hexdigest() == result[
              "task_packet_sha256"
          ], result
          assert result["phase_order"] == ["PHASE_A", "PHASE_B"], result
          assert result["phase_b_requires_phase_a_pass"] is True, result
          assert result["phase_a_status"] == "PASS", result
          assert result["phase_b_status"] == "PASS", result
          assert result["PHASE_A_FILL_EVENT_COUNT"] == 1, result
          assert result["PHASE_B_FILL_EVENT_COUNT"] == 1, result
          assert result["same_fixture_both_phases"] is True, result
          assert result["same_strategy_config_both_phases"] is True, result
          assert result["same_parquet_backtest_node_path_both_phases"] is True, result

          required_trigger_fields = {
              "instrument_id",
              "ts_event",
              "ts_init",
              "bid_price",
              "ask_price",
              "bid_size",
              "ask_size",
          }
          for name, expected_network, expected_public_call in (
              ("phase_a", False, False),
              ("phase_b", True, True),
          ):
              phase = result[name]
              assert phase["status"] == "PASS", phase
              assert phase["exact_git_head"] == result["exact_git_head"], phase
              assert phase["exact_git_tree"] == result["exact_git_tree"], phase
              assert phase["task_packet_sha256"] == result["task_packet_sha256"], phase
              assert phase["network"] is expected_network, phase
              assert phase["public_provider_call"] is expected_public_call, phase
              assert phase["source_event_bound_trigger"] is True, phase
              assert phase["timestamp_only_trigger"] is False, phase
              assert set(phase["trigger_identity_fields"]) == required_trigger_fields, phase
              assert set(phase["trigger_identity"]) == required_trigger_fields, phase
              assert phase["trigger_match_count"] == 1, phase
              assert phase["submit_order_count"] == 1, phase
              assert phase["quantity"] == 0.01, phase
              assert phase["quantity_python_type"] == "float", phase
              assert phase["fill_event_count"] == 1, phase
              fill = phase["sole_fill_event"]
              assert fill["phase"] == phase["phase"], phase
              assert fill["provider_native_order_filled"] is True, phase
              assert {
                  "client_order_id",
                  "venue_order_id",
                  "trade_id",
                  "event_id",
                  "last_qty",
                  "last_px",
                  "ts_event",
                  "ts_init",
              } <= set(fill), phase
              assert fill["client_order_id"] == phase["submitted_client_order_id"], phase
              assert phase["fill_client_order_id_equals_submitted"] is True, phase
              assert phase["subscriptions"] == {
                  "quotes": True,
                  "trades": True,
                  "bars": True,
              }, phase
              assert all(value > 0 for value in phase["observations"].values()), phase
              assert phase["catalog_typed_reads"] == {
                  "query_quote_ticks": 3,
                  "query_trade_ticks": 1,
                  "query_bars": 1,
              }, phase
              state = phase["provider_state"]
              assert state["source_api"] == "NAUTILUS_CACHE_PORTFOLIO", phase
              assert state["order_count"] == 1, phase
              assert state["position_count"] == 1, phase
              assert state["account_count"] == 1, phase
              assert phase["private_api"] is False, phase
              assert phase["signing"] is False, phase
              assert phase["exchange_write"] is False, phase
              assert phase["real_t2_credit"] is False, phase

          credential_proof = result["credential_negative_proof"]
          assert credential_proof["status"] == "PASS", credential_proof
          assert credential_proof["case_count"] == 4, credential_proof
          assert set(credential_proof["covered_variables"]) == {
              "HYPERLIQUID_PK",
              "HYPERLIQUID_VAULT",
              "HYPERLIQUID_TESTNET_PK",
              "HYPERLIQUID_TESTNET_VAULT",
          }, credential_proof
          assert len(credential_proof["cases"]) == 4, credential_proof
          for case in credential_proof["cases"]:
              assert case["synthetic_non_secret_sentinel"] is True, case
              assert case["guard_failed_closed"] is True, case
              for counter in (
                  "provider_client_construction_count",
                  "network_call_count",
                  "private_api_call_count",
                  "signing_count",
                  "exchange_write_count",
              ):
                  assert case[counter] == 0, case

          no_signer = result["runtime_no_signer_proof"]
          assert no_signer["status"] == "PASS", no_signer
          assert no_signer["credential_guard_passed"] is True, no_signer
          assert no_signer["no_signer_proven"] is True, no_signer
          assert no_signer["get_user_address_behavior"] == "RAISED_VALUE_ERROR_NO_SIGNER", no_signer
          assert no_signer["get_user_address_error_type"] == "ValueError", no_signer
          assert no_signer["get_user_address_error"] == "auth error: No signer configured", no_signer
          assert no_signer["no_signer_sequence_index"] < (
              no_signer["first_network_call_sequence_index"]
          ), no_signer
          assert no_signer["provider_client_construction_count"] == 1, no_signer
          assert no_signer["network_call_count"] == 1, no_signer
          assert no_signer["private_api_call_count"] == 0, no_signer
          assert no_signer["signing_count"] == 0, no_signer
          assert no_signer["exchange_write_count"] == 0, no_signer
          assert no_signer["public_call"] == (
              "HyperliquidHttpClient.load_instrument_definitions"
          ), no_signer
          assert no_signer["public_instrument_id"] == (
              "BTC-USD-PERP.HYPERLIQUID"
          ), no_signer
          assert no_signer["is_crypto_perpetual"] is True, no_signer
          assert result["private_api"] is False, result
          assert result["signing"] is False, result
          assert result["exchange_write"] is False, result
          assert result["real_t2_credit"] is False, result
          PY
      - name: Same-job bounded zero-write public E4 probe
        id: public_e4_probe
        continue-on-error: true
        run: |
          set +e
          E4_EXACT_HEAD="$(git rev-parse HEAD)" \
          E4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          timeout 150s /tmp/trader-assist-g4-venv/bin/python \
            scripts/e4_nautilus_public_data_probe.py \
            --evidence-path "${RUNNER_TEMP}/g4-same-job-e4-evidence" \
            --result-path "${RUNNER_TEMP}/g4-same-job-e4-result.json" \
            --ci-instrument-id ETH-USD-PERP.HYPERLIQUID \
            --provider-coin ETH \
            --run-seconds 90
          probe_exit=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/g4-same-job-e4-result.json" ]; then
            printf '{"schema_version":"E4_PUBLIC_PROVIDER_PROBE_RESULT_V1","status":"HARNESS_INFRASTRUCTURE_FAILURE","failure_class":"HARNESS_OR_INFRASTRUCTURE_FAILURE","probe_exit_code":%s}\n' \
              "${probe_exit}" > "${RUNNER_TEMP}/g4-same-job-e4-result.json"
          fi
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/g4-same-job-e4-result.json"
          exit "${probe_exit}"
      - name: Preserve same-job public E4 evidence
        if: ${{ always() && steps.public_e4_probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g4-same-job-e4-public-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/g4-same-job-e4-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Formal G4 technical qualification
        run: |
          G4_EXACT_HEAD="$(git rev-parse HEAD)" \
          G4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          /tmp/trader-assist-g4-venv/bin/python \
            scripts/nautilus_vnext_g4_qualification.py \
            --e4-probe-result "${RUNNER_TEMP}/g4-same-job-e4-result.json" \
            --result-path "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
      - name: Assert truthful bounded result
        run: |
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "vnext-formal-g4-qualification.json").read_text()
          )
          assert result["status"] == "TECHNICAL_G4_PARTIAL", result
          assert result["nautilus_version"] == "2.0.0rc5", result
          assert result["g4e0_contract_identity"] == "PASS", result
          assert result["g4e1_deterministic_causal_replay"] == "NOT_PROVEN", result
          assert result["g4e2_vnext_decision_parity"] == "NOT_PROVEN", result
          assert result["g4e3_explicit_execution_model"] == "PASS", result
          assert result["g4e4_candidate_state_isolation"] == "PASS", result
          assert result["g4e5_fill_fee_outcome_report_parity"] == "NOT_PROVEN", result
          assert result["g4e6_zero_write_live_path_composition"] == (
              "PASS_REQUIRES_EXACT_HEAD_E4_CI"
          ), result
          assert result["g4e7_reconnect_restart_nonregression"] == "NOT_PROVEN", result
          assert result["g4e8_representative_scale_runtime"] == "NOT_PROVEN", result
          assert result["formal_g4_technical_acceptance"] is False, result
          assert result["representative_scale_boundary"] >= 20, result
          assert result["representative_evidence_supplied"] is False, result
          assert result["actual_representative_market_count"] == 0, result
          assert result["g4e8_canonical_acceptance_comment_id"] is None, result
          assert result["g4e8_canonical_acceptance_receipt_hash"] is None, result
          assert result["g4e8_representative_artifact_hash"] is None, result
          assert result["backtest_node_catalog_surface"] is True, result
          assert result["provider_native_backtest_engine"] is True, result
          assert result["provider_native_fill_model"] is True, result
          assert result["provider_state_source_api"] == "NAUTILUS_CACHE_PORTFOLIO", result
          assert result["controlled_provider_order_count"] > 0, result
          assert result["controlled_provider_filled_order_count"] > 0, result
          assert result["controlled_replay_is_representative_evidence"] is False, result
          assert result["t0_controls_are_formal_causal_proof"] is False, result
          assert result["t0_serializer_restart_identical"] is True, result
          assert result["t2_real_causal_artifact_supplied"] is False, result
          assert result["derived_cache_is_authoritative_market_truth"] is False, result
          assert result["strategy_edge_proven"] is False, result
          assert result["confirmatory_e5_open"] is False, result
          assert result["private_api"] is False, result
          assert result["signing"] is False, result
          assert result["exchange_write"] is False, result
          assert result["venue_submitted"] is False, result
          PY
      - name: Upload Formal G4 qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nautilus-vnext-formal-g4-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/vnext-formal-g4-qualification.json
          if-no-files-found: error
          retention-days: 14

  representative-capture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.representative_capture }}
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_G4_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock
      - name: Exact hashed rc5 capture environment
        run: |
          python -m venv /tmp/trader-assist-g4-capture-venv
          /tmp/trader-assist-g4-capture-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-g4-capture-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-g4-capture-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
      - name: Dependency and exact rc5 capture identity
        run: |
          /tmp/trader-assist-g4-capture-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-g4-capture-venv/bin/python -m pip check
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          /tmp/trader-assist-g4-capture-venv/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("nautilus-trader") == "2.0.0rc5"
          PY
      - name: Validate representative-capture exact head
        env:
          EXPECTED_EXACT_HEAD: ${{ inputs.expected_exact_head }}
        run: |
          test "${#EXPECTED_EXACT_HEAD}" -eq 40
          test "$(git rev-parse HEAD)" = "${EXPECTED_EXACT_HEAD}"
          test "${GITHUB_SHA}" = "${EXPECTED_EXACT_HEAD}"
      - name: Fixed prospective 20-market representative capture
        id: representative_capture
        continue-on-error: true
        timeout-minutes: 8
        env:
          EXPECTED_EXACT_HEAD: ${{ inputs.expected_exact_head }}
        run: |
          set +e
          evidence_root="${RUNNER_TEMP}/g4-representative-capture"
          /tmp/trader-assist-g4-capture-venv/bin/python -m \
            scripts.nautilus_vnext_g4_representative_acquisition \
            --evidence-root "${evidence_root}" \
            --result-path "${evidence_root}/acquisition-result.json" \
            --expected-head "${EXPECTED_EXACT_HEAD}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
          capture_exit=$?
          set -e
          if [ ! -s "${evidence_root}/acquisition-result.json" ]; then
            mkdir -p "${evidence_root}"
            printf '{"RESULT":"APPLICATION_OR_PROVIDER_RUNTIME_FAILURE","failure_class":"HARNESS_OR_INFRASTRUCTURE_FAILURE","github_run_id":"%s","github_run_attempt":%s,"exact_head":"%s","exact_tree":"%s","capture_exit_code":%s,"G4E8":"NOT_PROVEN"}\n' \
              "${GITHUB_RUN_ID}" \
              "${GITHUB_RUN_ATTEMPT}" \
              "$(git rev-parse HEAD)" \
              "$(git rev-parse 'HEAD^{tree}')" \
              "${capture_exit}" > "${evidence_root}/acquisition-result.json"
          fi
          /tmp/trader-assist-g4-capture-venv/bin/python -m json.tool \
            "${evidence_root}/acquisition-result.json"
          exit "${capture_exit}"
      - name: Preserve representative-capture evidence before classification
        if: >-
          ${{ always() && steps.representative_capture.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g4-representative-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/g4-representative-capture
          if-no-files-found: error
          retention-days: 30
      - name: Fail-closed representative-capture classification
        if: >-
          ${{ always() && steps.representative_capture.outcome != 'skipped' }}
        env:
          CAPTURE_RESULT: ${{ runner.temp }}/g4-representative-capture/acquisition-result.json
          EXPECTED_EXACT_HEAD: ${{ inputs.expected_exact_head }}
        run: |
          /tmp/trader-assist-g4-capture-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["CAPTURE_RESULT"]).read_text())
          assert result["exact_head"] == os.environ["EXPECTED_EXACT_HEAD"], result
          assert result["github_run_id"] == os.environ["GITHUB_RUN_ID"], result
          assert result["github_run_attempt"] == int(os.environ["GITHUB_RUN_ATTEMPT"]), result
          assert result["target_count"] == 20, result
          assert result["run_seconds"] == 180, result
          assert result["watch_market_count"] == 20, result
          assert result["external_one_minute_bar_type_count"] == 20, result
          assert result["G4E8"] == "NOT_PROVEN", result
          assert result["zero_credentials"] is True, result
          assert result["zero_execution_client"] is True, result
          assert result["zero_signing"] is True, result
          assert result["zero_exchange_write"] is True, result
          assert result["RESULT"] == "COMPLETE_REPRESENTATIVE_CANDIDATE_BUILT", result
          PY

  formal-g4-finalize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_g4_finalize }}
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_G4_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock
      - name: Exact hashed rc5 finalization environment
        run: |
          python -m venv /tmp/trader-assist-g4-finalize-venv
          /tmp/trader-assist-g4-finalize-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-g4-finalize-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-g4-finalize-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
      - name: Validate Formal G4 exact reviewed head
        env:
          EXPECTED_EXACT_HEAD: ${{ inputs.expected_exact_head }}
          AUTHORITATIVE_E4_CI_RUN_ID: ${{ inputs.authoritative_e4_ci_run_id }}
          G4E8_REATTESTATION_COMMENT_ID: ${{ inputs.canonical_g4e8_reattestation_comment_id }}
        run: |
          test "${#EXPECTED_EXACT_HEAD}" -eq 40
          test "$(git rev-parse HEAD)" = "${EXPECTED_EXACT_HEAD}"
          test "${GITHUB_SHA}" = "${EXPECTED_EXACT_HEAD}"
          test "${AUTHORITATIVE_E4_CI_RUN_ID}" -gt 0
          test "${G4E8_REATTESTATION_COMMENT_ID}" -gt 0
      - name: Download exact accepted Task 5B artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "10613633203"
          path: ${{ runner.temp }}/task5b-representative-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: woshixiong/trader-assist-v0
          run-id: "35538401855"
      - name: Produce exact-head Formal G4 qualification
        id: formal_g4_qualification
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORITATIVE_E4_CI_RUN_ID: ${{ inputs.authoritative_e4_ci_run_id }}
          G4E8_REATTESTATION_COMMENT_ID: ${{ inputs.canonical_g4e8_reattestation_comment_id }}
          T2_ACCEPTANCE_COMMENT_ID: ${{ inputs.canonical_t2_acceptance_comment_id }}
        run: |
          args=(
            --result-path "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
            --formal-g4-finalize
            --task5b-artifact-root "${RUNNER_TEMP}/task5b-representative-artifact"
            --authoritative-e4-ci-run-id "${AUTHORITATIVE_E4_CI_RUN_ID}"
            --canonical-g4e8-reattestation-comment-id "${G4E8_REATTESTATION_COMMENT_ID}"
          )
          if [ -n "${T2_ACCEPTANCE_COMMENT_ID}" ]; then
            args+=(--canonical-t2-acceptance-comment-id "${T2_ACCEPTANCE_COMMENT_ID}")
          fi
          G4_EXACT_HEAD="$(git rev-parse HEAD)" \
          G4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          /tmp/trader-assist-g4-finalize-venv/bin/python \
            scripts/nautilus_vnext_g4_qualification.py "${args[@]}"
      - name: Preserve exact-head Formal G4 qualification artifact
        if: ${{ always() && steps.formal_g4_qualification.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nautilus-vnext-formal-g4-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/vnext-formal-g4-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Assert exact Formal G4 closure
        if: ${{ always() }}
        env:
          FORMAL_RESULT: ${{ runner.temp }}/vnext-formal-g4-qualification.json
          EXPECTED_EXACT_HEAD: ${{ inputs.expected_exact_head }}
        run: |
          test "${{ steps.formal_g4_qualification.outcome }}" = "success"
          /tmp/trader-assist-g4-finalize-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["FORMAL_RESULT"]).read_text())
          assert result["schema_version"] == (
              "VNEXT_FORMAL_G4_TECHNICAL_QUALIFICATION_RESULT_V3"
          ), result
          assert result["status"] == "FORMAL_G4_TECHNICAL_ACCEPTED", result
          assert result["formal_g4_finalization_mode"] is True, result
          assert result["exact_head"] == os.environ["EXPECTED_EXACT_HEAD"], result
          assert set(result["formal_g4_ladder"]) == {
              f"G4E{ordinal}" for ordinal in range(9)
          }, result
          assert set(result["formal_g4_ladder"].values()) == {"PASS"}, result
          assert result["formal_g4_technical_acceptance"] is True, result
          assert result["task5b_artifact_status"] == "PASS", result
          assert result["g4e6_zero_write_live_path_composition"] == "PASS", result
          assert result["g4e8_representative_scale_runtime"] == "PASS", result
          assert result["strategy_edge_proven"] is False, result
          assert result["confirmatory_e5_open"] is False, result
          assert result["private_api"] is False, result
          assert result["signing"] is False, result
          assert result["exchange_write"] is False, result
          assert result["venue_submitted"] is False, result
          PY
