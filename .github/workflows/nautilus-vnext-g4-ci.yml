name: Nautilus VNext G4 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnext-g4:
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_G4_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock
      - name: Exact hashed rc5 environment
        run: |
          python -m venv /tmp/trader-assist-g4-venv
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
      - name: Dependency and exact rc5 identity
        run: |
          /tmp/trader-assist-g4-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-g4-venv/bin/python -m pip check
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("nautilus-trader") == "2.0.0rc5"
          PY
      - name: Exact rc5 provider-native T2 capability spike
        id: t2_rc5_spike
        continue-on-error: true
        timeout-minutes: 4
        env:
          T2_SPIKE_PACKET_SHA256: d93e81c882cf4fd18ecb05c5621dc770d2663a8d3aa269f6074190752bf7ebcd
        run: |
          set +e
          cat > "${RUNNER_TEMP}/g4_rc5_spike_strategy.py" <<'PY'
          import json
          from pathlib import Path

          from nautilus_trader.config import StrategyConfig
          from nautilus_trader.model import BarType, InstrumentId, OrderSide
          from nautilus_trader.trading import Strategy


          class G4Rc5SpikeConfig(StrategyConfig):
              def __init__(
                  self,
                  *,
                  instrument_id: str,
                  bar_type: str,
                  trigger_ts: int,
                  quantity: str,
                  proof_path: str,
                  **_kwargs: object,
              ) -> None:
                  super().__init__()
                  self.instrument_id = InstrumentId.from_str(instrument_id)
                  self.bar_type = BarType.from_str(bar_type)
                  self.trigger_ts = int(trigger_ts)
                  self.quantity = quantity
                  self.proof_path = proof_path


          class G4Rc5SpikeStrategy(Strategy):
              def __init__(self, config: G4Rc5SpikeConfig) -> None:
                  super().__init__(config)
                  self._submitted = False

              def _record(self, kind: str, ts_event: int) -> None:
                  path = Path(self.config.proof_path)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with path.open("a", encoding="utf-8") as fh:
                      fh.write(json.dumps({"kind": kind, "ts_event": int(ts_event)}, sort_keys=True))
                      fh.write("\n")

              def on_start(self) -> None:
                  self.subscribe_quotes(self.config.instrument_id)
                  self.subscribe_trades(self.config.instrument_id)
                  self.subscribe_bars(self.config.bar_type)

              def on_quote(self, tick) -> None:
                  self._record("QUOTE", tick.ts_event)
                  if self._submitted or int(tick.ts_event) != self.config.trigger_ts:
                      return
                  instrument = self.cache.instrument(self.config.instrument_id)
                  if instrument is None:
                      raise RuntimeError("spike instrument missing from Nautilus cache")
                  order = self.order_factory.market(
                      self.config.instrument_id,
                      OrderSide.BUY,
                      instrument.make_qty(self.config.quantity),
                  )
                  self._submitted = True
                  self._record("SUBMIT", tick.ts_event)
                  self.submit_order(order)

              def on_trade(self, tick) -> None:
                  self._record("TRADE", tick.ts_event)

              def on_bar(self, bar) -> None:
                  self._record("BAR", bar.ts_event)
          PY

          T2_SPIKE_EXACT_HEAD="$(git rev-parse HEAD)"           T2_SPIKE_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')"           PYTHONPATH="${RUNNER_TEMP}:${PYTHONPATH:-}"           timeout 180s /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          from __future__ import annotations

          import asyncio
          import hashlib
          import json
          import os
          import sys
          from decimal import Decimal
          from pathlib import Path

          from nautilus_trader.adapters.hyperliquid import (
              HyperliquidEnvironment,
              HyperliquidHttpClient,
          )
          from nautilus_trader.backtest import BacktestNode
          from nautilus_trader.config import (
              BacktestDataConfig,
              BacktestEngineConfig,
              BacktestRunConfig,
              BacktestVenueConfig,
              ImportableStrategyConfig,
          )
          from nautilus_trader.model import (
              AccountType,
              AggregationSource,
              AggressorSide,
              Bar,
              BarAggregation,
              BarSpecification,
              BarType,
              BookType,
              OmsType,
              PriceType,
              QuoteTick,
              TradeId,
              TradeTick,
          )
          from nautilus_trader.persistence import ParquetDataCatalog

          from trader_assist_v0.nautilus_g4.runner import project_provider_native_state


          result_path = Path(os.environ["RUNNER_TEMP"]) / "t2-rc5-capability-spike-result.json"
          catalog_path = Path(os.environ["RUNNER_TEMP"]) / "t2-rc5-capability-catalog"
          proof_path = Path(os.environ["RUNNER_TEMP"]) / "t2-rc5-capability-callbacks.jsonl"

          blocked_env_names = (
              "HYPERLIQUID_PK",
              "HYPERLIQUID_TESTNET_PK",
              "HYPERLIQUID_VAULT",
              "HYPERLIQUID_TESTNET_VAULT",
              "HYPERLIQUID_ACCOUNT_ADDRESS",
          )
          present = tuple(name for name in blocked_env_names if os.environ.get(name))
          if present:
              raise RuntimeError(f"credential/account environment must be absent: {present}")

          sys.path.insert(0, os.environ["RUNNER_TEMP"])

          async def load_btc():
              client = HyperliquidHttpClient(
                  private_key=None,
                  vault_address=None,
                  account_address=None,
                  environment=HyperliquidEnvironment.MAINNET,
                  timeout_secs=45,
                  proxy_url=None,
                  normalize_prices=True,
                  include_builder_attribution=False,
              )
              instruments = await client.load_instrument_definitions(
                  include_spot=False,
                  include_perps=True,
                  include_perps_hip3=False,
                  include_outcomes=False,
              )
              matches = [item for item in instruments if str(item.id) == "BTC-USD-PERP.HYPERLIQUID"]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one BTC-USD-PERP.HYPERLIQUID instrument, got {len(matches)}"
                  )
              return matches[0], len(instruments)

          instrument, public_instrument_count = asyncio.run(load_btc())

          catalog_path.mkdir(parents=True, exist_ok=True)
          catalog = ParquetDataCatalog(str(catalog_path))
          catalog.write_instruments([instrument])
          reloaded_instruments = catalog.instruments()
          reloaded = [item for item in reloaded_instruments if str(item.id) == str(instrument.id)]
          if len(reloaded) != 1:
              raise RuntimeError("provider-native Instrument catalog round-trip failed")
          instrument = reloaded[0]

          base_ns = 1_800_000_000_000_000_000
          quote_ts = base_ns + 1_000_000_000
          trade_ts = base_ns + 2_000_000_000
          bar_ts = base_ns + 60_000_000_000

          bid = instrument.make_price(Decimal("100000"))
          price_increment = Decimal(str(instrument.price_increment))
          ask = instrument.make_price(Decimal("100000") + price_increment)
          qty = instrument.make_qty(Decimal("0.01"))

          quote = QuoteTick(
              instrument_id=instrument.id,
              bid_price=bid,
              ask_price=ask,
              bid_size=qty,
              ask_size=qty,
              ts_event=quote_ts,
              ts_init=quote_ts,
          )
          trade = TradeTick(
              instrument_id=instrument.id,
              price=ask,
              size=qty,
              aggressor_side=AggressorSide.BUY,
              trade_id=TradeId("T2-RC5-SPIKE-TRADE-1"),
              ts_event=trade_ts,
              ts_init=trade_ts,
          )
          bar_spec = BarSpecification(1, BarAggregation.MINUTE, PriceType.LAST)
          bar_type = BarType(instrument.id, bar_spec, AggregationSource.EXTERNAL)
          bar = Bar(
              bar_type=bar_type,
              open=bid,
              high=ask,
              low=bid,
              close=ask,
              volume=qty,
              ts_event=bar_ts,
              ts_init=bar_ts,
          )

          catalog.write_quote_ticks([quote])
          catalog.write_trade_ticks([trade])
          catalog.write_bars([bar])

          settlement_currency = getattr(instrument, "settlement_currency", None)
          if settlement_currency is None:
              raise RuntimeError("provider-native perpetual has no settlement_currency")

          venue = BacktestVenueConfig(
              name=str(instrument.id.venue),
              oms_type=OmsType.NETTING,
              account_type=AccountType.MARGIN,
              book_type=BookType.L1_MBP,
              base_currency=settlement_currency,
              starting_balances=[f"1_000_000 {settlement_currency}"],
          )
          end_ns = bar_ts + 1
          data = [
              BacktestDataConfig(
                  data_type="QuoteTick",
                  catalog_path=str(catalog_path),
                  instrument_id=instrument.id,
                  start_time=quote_ts,
                  end_time=end_ns,
              ),
              BacktestDataConfig(
                  data_type="TradeTick",
                  catalog_path=str(catalog_path),
                  instrument_id=instrument.id,
                  start_time=quote_ts,
                  end_time=end_ns,
              ),
              BacktestDataConfig(
                  data_type="Bar",
                  catalog_path=str(catalog_path),
                  instrument_ids=[instrument.id],
                  start_time=quote_ts,
                  end_time=end_ns,
                  bar_spec=bar_spec,
                  bar_types=[str(bar_type)],
              ),
          ]
          run_config = BacktestRunConfig(
              venues=[venue],
              data=data,
              engine=BacktestEngineConfig(),
              dispose_on_completion=False,
          )
          strategy_config = ImportableStrategyConfig(
              strategy_path="g4_rc5_spike_strategy:G4Rc5SpikeStrategy",
              config_path="g4_rc5_spike_strategy:G4Rc5SpikeConfig",
              config={
                  "instrument_id": str(instrument.id),
                  "bar_type": str(bar_type),
                  "trigger_ts": quote_ts,
                  "quantity": "0.01",
                  "proof_path": str(proof_path),
              },
          )

          node = BacktestNode(configs=[run_config])
          try:
              node.build()
              node.add_strategy_from_config(run_config.id, strategy_config)
              backtest_results = node.run()
              cache = node.get_engine_cache(run_config.id)
              portfolio = node.get_engine_portfolio(run_config.id)
              if cache is None or portfolio is None:
                  raise RuntimeError("BacktestNode did not retain public Cache/Portfolio state")
              projection = project_provider_native_state(
                  cache,
                  portfolio,
                  venue=instrument.id.venue,
              )
          finally:
              node.dispose()

          callback_rows = [
              json.loads(line)
              for line in proof_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          callback_kinds = [row["kind"] for row in callback_rows]
          for required in ("QUOTE", "SUBMIT", "TRADE", "BAR"):
              if callback_kinds.count(required) != 1:
                  raise RuntimeError(
                      f"expected exactly one {required} callback/proof row, got {callback_kinds}"
                  )

          if projection.order_count != 1:
              raise RuntimeError(f"expected exactly one provider order, got {projection.order_count}")
          if projection.filled_order_count != 1:
              raise RuntimeError(
                  f"expected exactly one provider fill, got {projection.filled_order_count}"
              )
          if projection.position_count != 1:
              raise RuntimeError(
                  f"expected exactly one provider position, got {projection.position_count}"
              )
          if projection.account_count != 1:
              raise RuntimeError(
                  f"expected exactly one provider account, got {projection.account_count}"
              )

          def hash_tree(root: Path) -> str:
              digest = hashlib.sha256()
              files = sorted(path for path in root.rglob("*") if path.is_file())
              if not files:
                  raise RuntimeError("catalog artifact tree is empty")
              for path in files:
                  rel = path.relative_to(root).as_posix().encode()
                  digest.update(len(rel).to_bytes(8, "big"))
                  digest.update(rel)
                  payload = path.read_bytes()
                  digest.update(len(payload).to_bytes(8, "big"))
                  digest.update(payload)
              return digest.hexdigest()

          payload = {
              "schema_version": "T2_RC5_CAPABILITY_SPIKE_RESULT_V1",
              "status": "PASS",
              "task_packet_sha256": os.environ["T2_SPIKE_PACKET_SHA256"],
              "exact_head": os.environ["T2_SPIKE_EXACT_HEAD"],
              "exact_tree": os.environ["T2_SPIKE_EXACT_TREE"],
              "nautilus_version": "2.0.0rc5",
              "network_surface": "HYPERLIQUID_PUBLIC_METADATA_ONLY",
              "credential_environment_present": False,
              "private_api": False,
              "signing": False,
              "exchange_write": False,
              "real_t2_credit": False,
              "instrument_id": str(instrument.id),
              "instrument_type": f"{type(instrument).__module__}.{type(instrument).__qualname__}",
              "public_instrument_count": public_instrument_count,
              "catalog_instrument_roundtrip": True,
              "catalog_tree_sha256": hash_tree(catalog_path),
              "quote_tick_replayed": callback_kinds.count("QUOTE") == 1,
              "trade_tick_replayed": callback_kinds.count("TRADE") == 1,
              "bar_replayed": callback_kinds.count("BAR") == 1,
              "source_event_bound_submit": callback_kinds.count("SUBMIT") == 1,
              "backtest_result_count": len(backtest_results),
              "provider_state": projection.model_dump(mode="json"),
          }
          result_path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY
          spike_exit=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/t2-rc5-capability-spike-result.json" ]; then
            printf '{"schema_version":"T2_RC5_CAPABILITY_SPIKE_RESULT_V1","status":"FAIL","failure_class":"HARNESS_OR_PUBLIC_SURFACE_FAILURE","exit_code":%s,"real_t2_credit":false,"private_api":false,"signing":false,"exchange_write":false}\n'               "${spike_exit}" > "${RUNNER_TEMP}/t2-rc5-capability-spike-result.json"
          fi
          /tmp/trader-assist-g4-venv/bin/python -m json.tool             "${RUNNER_TEMP}/t2-rc5-capability-spike-result.json"
          exit "${spike_exit}"

      - name: Preserve exact rc5 T2 capability spike evidence
        if: ${{ always() && steps.t2_rc5_spike.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t2-rc5-capability-spike-${{ github.sha }}
          path: ${{ runner.temp }}/t2-rc5-capability-spike-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Assert exact rc5 T2 capability spike
        run: |
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "t2-rc5-capability-spike-result.json").read_text()
          )
          assert result["status"] == "PASS", result
          assert result["task_packet_sha256"] == (
              "d93e81c882cf4fd18ecb05c5621dc770d2663a8d3aa269f6074190752bf7ebcd"
          ), result
          assert result["nautilus_version"] == "2.0.0rc5", result
          assert result["network_surface"] == "HYPERLIQUID_PUBLIC_METADATA_ONLY", result
          assert result["credential_environment_present"] is False, result
          assert result["private_api"] is False, result
          assert result["signing"] is False, result
          assert result["exchange_write"] is False, result
          assert result["real_t2_credit"] is False, result
          assert result["instrument_id"] == "BTC-USD-PERP.HYPERLIQUID", result
          assert result["catalog_instrument_roundtrip"] is True, result
          assert result["quote_tick_replayed"] is True, result
          assert result["trade_tick_replayed"] is True, result
          assert result["bar_replayed"] is True, result
          assert result["source_event_bound_submit"] is True, result
          assert result["provider_state"]["order_count"] == 1, result
          assert result["provider_state"]["filled_order_count"] == 1, result
          assert result["provider_state"]["position_count"] == 1, result
          assert result["provider_state"]["account_count"] == 1, result
          PY

      - name: Focused G4 deterministic gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_vnext_g4_contracts.py \
            tests/test_vnext_g4_evaluator.py \
            tests/test_vnext_g4_reporting.py \
            tests/test_nautilus_vnext_g4_catalog_bridge.py \
            tests/test_nautilus_vnext_g4_runner.py
      - name: E4 source-authority regressions
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_e4_contracts.py \
            tests/test_nautilus_e4_capture.py
      - name: E3 structural-reference regressions
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_pilot_contracts.py
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_pilot_version_contract.py
      - name: Static gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m ruff check \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          /tmp/trader-assist-g4-venv/bin/python -m mypy \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py
          /tmp/trader-assist-g4-venv/bin/python -m compileall -q \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          test "$(sha256sum src/trader_assist_v0/vnext_g4/evaluator.py | cut -d' ' -f1)" = \
            "63e44fcefdbb714267a293e823aa5114bc705a5f220b1db3834f4706521a4c18"
          git diff --check
      - name: Same-job bounded zero-write public E4 probe
        id: public_e4_probe
        continue-on-error: true
        run: |
          set +e
          E4_EXACT_HEAD="$(git rev-parse HEAD)" \
          E4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          timeout 150s /tmp/trader-assist-g4-venv/bin/python \
            scripts/e4_nautilus_public_data_probe.py \
            --evidence-path "${RUNNER_TEMP}/g4-same-job-e4-evidence" \
            --result-path "${RUNNER_TEMP}/g4-same-job-e4-result.json" \
            --ci-instrument-id ETH-USD-PERP.HYPERLIQUID \
            --provider-coin ETH \
            --run-seconds 90
          probe_exit=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/g4-same-job-e4-result.json" ]; then
            printf '{"schema_version":"E4_PUBLIC_PROVIDER_PROBE_RESULT_V1","status":"HARNESS_INFRASTRUCTURE_FAILURE","failure_class":"HARNESS_OR_INFRASTRUCTURE_FAILURE","probe_exit_code":%s}\n' \
              "${probe_exit}" > "${RUNNER_TEMP}/g4-same-job-e4-result.json"
          fi
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/g4-same-job-e4-result.json"
          exit "${probe_exit}"
      - name: Preserve same-job public E4 evidence
        if: ${{ always() && steps.public_e4_probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g4-same-job-e4-public-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/g4-same-job-e4-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Formal G4 technical qualification
        run: |
          G4_EXACT_HEAD="$(git rev-parse HEAD)" \
          G4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          /tmp/trader-assist-g4-venv/bin/python \
            scripts/nautilus_vnext_g4_qualification.py \
            --e4-probe-result "${RUNNER_TEMP}/g4-same-job-e4-result.json" \
            --result-path "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
      - name: Assert truthful bounded result
        run: |
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "vnext-formal-g4-qualification.json").read_text()
          )
          assert result["status"] == "TECHNICAL_G4_PARTIAL", result
          assert result["nautilus_version"] == "2.0.0rc5", result
          assert result["g4e0_contract_identity"] == "PASS", result
          assert result["g4e1_deterministic_causal_replay"] == "NOT_PROVEN", result
          assert result["g4e2_vnext_decision_parity"] == "NOT_PROVEN", result
          assert result["g4e3_explicit_execution_model"] == "PASS", result
          assert result["g4e4_candidate_state_isolation"] == "PASS", result
          assert result["g4e5_fill_fee_outcome_report_parity"] == "NOT_PROVEN", result
          assert result["g4e6_zero_write_live_path_composition"] == (
              "PASS_REQUIRES_EXACT_HEAD_E4_CI"
          ), result
          assert result["g4e7_reconnect_restart_nonregression"] == "NOT_PROVEN", result
          assert result["g4e8_representative_scale_runtime"] == "NOT_PROVEN", result
          assert result["formal_g4_technical_acceptance"] is False, result
          assert result["representative_scale_boundary"] >= 20, result
          assert result["representative_evidence_supplied"] is False, result
          assert result["actual_representative_market_count"] == 0, result
          assert result["backtest_node_catalog_surface"] is True, result
          assert result["provider_native_backtest_engine"] is True, result
          assert result["provider_native_fill_model"] is True, result
          assert result["provider_state_source_api"] == "NAUTILUS_CACHE_PORTFOLIO", result
          assert result["controlled_provider_order_count"] > 0, result
          assert result["controlled_provider_filled_order_count"] > 0, result
          assert result["controlled_replay_is_representative_evidence"] is False, result
          assert result["t0_controls_are_formal_causal_proof"] is False, result
          assert result["t0_serializer_restart_identical"] is True, result
          assert result["t2_real_causal_artifact_supplied"] is False, result
          assert result["derived_cache_is_authoritative_market_truth"] is False, result
