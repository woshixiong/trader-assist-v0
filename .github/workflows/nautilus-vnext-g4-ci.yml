name: Nautilus VNext G4 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnext-g4:
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_G4_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock
      - name: Exact hashed rc5 environment
        run: |
          python -m venv /tmp/trader-assist-g4-venv
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
      - name: Dependency and exact rc5 identity
        run: |
          /tmp/trader-assist-g4-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-g4-venv/bin/python -m pip check
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("nautilus-trader") == "2.0.0rc5"
          PY
      - name: Freeze exact BTC F1 acquisition plan
        id: f1_plan_freeze
        continue-on-error: true
        env:
          TARGET_SHA: cb8109b92b37ca4fb85fdce3f95a1bf8954589c4
          TARGET_TREE: a16075d4cc32c841ce4c207b072a86c1a24c01f8
          MARKET_ID: 7df4530dee44516e601335ea792c74c1186be88238452edc1f75bafd8257e605
          INSTRUMENT_ID: BTC-USD-PERP.HYPERLIQUID
          BAR_TYPE: BTC-USD-PERP.HYPERLIQUID-5-MINUTE-LAST-EXTERNAL
          UPSTREAM: 1b0a49d2792a9432a3aca3fcb617ce7a630d905e
          OUT: ${{ runner.temp }}/formal-g4-t2-f1-plan
          PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
          PROOF_PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          mkdir -p "${OUT}"
          changed="$(git diff --name-only "${TARGET_SHA}" HEAD)"
          [ "${changed}" = ".github/workflows/nautilus-vnext-g4-ci.yml" ] || {
            printf 'unexpected proof scope:\n%s\n' "${changed}" >&2; exit 91; }
          [ "$(git show -s --format=%T "${TARGET_SHA}")" = "${TARGET_TREE}" ] || exit 92
          /tmp/trader-assist-g4-venv/bin/python - <<'PY' >"${OUT}/builder.stdout" 2>"${OUT}/builder.stderr"
          import json, os, time
          from datetime import UTC, datetime
          from pathlib import Path
          from trader_assist_v0.contracts.common import canonical_json_bytes, sha256_hex
          from trader_assist_v0.multi_asset_shadow.hyperliquid_public import HyperliquidPublicClient
          from trader_assist_v0.multi_asset_shadow.resolution import resolve_first_launch_20
          from trader_assist_v0.nautilus_e4.contracts import MarketExpression, PitUniverseSnapshot, RunManifest
          from trader_assist_v0.nautilus_e4.safety import assert_public_only

          E=os.environ; O=Path(E["OUT"]); D=b"trader-assist-v0/g4/t2-acquisition-plan/v1\0"
          sha,tree,mid,iid,bar,up=E["TARGET_SHA"],E["TARGET_TREE"],E["MARKET_ID"],E["INSTRUMENT_ID"],E["BAR_TYPE"],E["UPSTREAM"]
          ph,pr=E["PROOF_HEAD"],int(E["PROOF_PR"])
          assert_public_only(env=E)
          c=HyperliquidPublicClient(); dex=c.perp_dexes(); metas=c.all_perp_metas()
          obs=datetime.now(UTC)
          rr=resolve_first_launch_20(perp_dexes=dex,all_perp_metas=metas,observed_at=obs)
          mm=[x for x in rr if x.request.display=="BTC"]
          if len(mm)!=1 or mm[0].status!="RESOLVED" or mm[0].market is None: raise RuntimeError("BTC resolution failed")
          m=mm[0].market
          if (m.identity.dex,m.identity.coin,m.identity.market_id)!=("MAIN","BTC",mid): raise RuntimeError("BTC identity drift")
          mv=f"HL_MAIN_BTC_META_{m.metadata_hash[:16]}"
          x=MarketExpression(market_id=mid,dex="MAIN",provider_coin="BTC",instrument_id=iid,
              expression_id=f"mvsf-f1-btc-main-{m.metadata_hash[:16]}",listing_state=m.market_status,
              instrument_metadata_version=mv,instrument_metadata_hash=m.metadata_hash)
          s=PitUniverseSnapshot.create(observed_at_ns=time.time_ns(),expressions=(x,))
          manifest=RunManifest.create(run_id=f"t2-f1-btc-{s.snapshot_hash[:16]}",git_sha=sha,git_tree=tree,snapshot=s,
              process_epoch=f"t2f1-process-{s.snapshot_hash[:16]}",continuity_epoch=f"t2f1-continuity-{s.snapshot_hash[:16]}",
              admission_epoch=f"t2f1-admission-{s.snapshot_hash[:16]}",
              capture_configuration={"purpose":"FORMAL_G4_FIRST_REAL_T2_F1","market_selection_owner":"MARKET_AND_VENUE_SELECTION",
                "selection_freeze_comment":5726539966,"identity_correction_comment":5726758424,
                "proof_workflow_head":ph,"proof_pr_number":pr,"expressions":[x.model_dump(mode="json")],
                "public_metadata_only_at_plan_freeze":True},
              subscription_policy={"discovery":[mid],"watch":[],"actionable":[mid]},trial_ledger_id="formal-g4-first-real-t2-f1-btc-v1")
          step=300_000; n=2304; end=(time.time_ns()//1_000_000//step)*step-step; cur=end-n*step; rem=n; pages=[]
          while rem:
              k=min(500,rem); nxt=cur+k*step; pages.append({"page_index":len(pages),"start_ms":cur,"end_ms":nxt,"expected_count":k}); cur=nxt; rem-=k
          if [p["expected_count"] for p in pages] != [500,500,500,500,304]: raise RuntimeError("page ledger drift")
          payload={"schema_version":"VNEXT_G4_T2_ACQUISITION_PLAN_V1","nautilus_version":"2.0.0rc5","nautilus_upstream_commit":up,
            "history_5m_required":2304,"history_page_size_max":500,"redundant_15m_1h_requests":False,"git_sha":sha,"git_tree":tree,
            "source_e4_manifest_hash":manifest.manifest_hash,"source_pit_snapshot_hash":s.snapshot_hash,"market_id":mid,"expression_id":x.expression_id,
            "instrument_id":iid,"instrument_metadata_version":mv,"instrument_metadata_hash":m.metadata_hash,"bar_type":bar,"pages":pages}
          h=sha256_hex(D+canonical_json_bytes(payload)); plan={**payload,"acquisition_plan_hash":h}
          evidence={"schema_version":"T2_F1_PROVIDER_METADATA_EVIDENCE_V2","observed_at":obs.isoformat(),"proof_workflow_head":ph,"proof_pr_number":pr,
            "requests_performed":["perpDexs","allPerpMetas"],"perp_dexes_hash":sha256_hex(canonical_json_bytes(dex)),
            "all_perp_metas_hash":sha256_hex(canonical_json_bytes(metas)),"selected_registry_market":m.model_dump(mode="json"),"candle_requests":0,
            "l2_requests":0,"trade_streams":0,"setup_observation":0,"outcome_observation":0,"private_api":False,"credentials":False,"signing":False,"exchange_write":False}
          authority={"schema_version":"TRADE_OS_T2_F1_MARKET_VENUE_PLAN_CHECKPOINT_V3_GITHUB_ACTIONS","contract_closure_review_comment":5726453814,
            "selection_freeze_comment":5726539966,"command_audit_comment":5726758424,"owner_domain":"MARKET_AND_VENUE_SELECTION","selected_underlying":"BTC",
            "selected_venue":"HYPERLIQUID","selected_dex":"MAIN","selected_provider_coin":"BTC","selection_frozen_before_history_or_setup_observation":True,
            "post_hoc_market_substitution":False,"git_sha":sha,"git_tree":tree,"nautilus_version":"2.0.0rc5","nautilus_upstream_commit":up,
            "source_e4_manifest_hash":manifest.manifest_hash,"source_pit_snapshot_hash":s.snapshot_hash,"market_id":mid,"expression_id":x.expression_id,
            "instrument_id":iid,"instrument_metadata_version":mv,"instrument_metadata_hash":m.metadata_hash,"bar_type":bar,"history_end_ms":end,
            "exact_2304x5m_page_ledger":pages,"acquisition_plan_hash":h,"proof_workflow_head":ph,"proof_pr_number":pr}
          files={"f1_market_authority_checkpoint.json":authority,"f1_acquisition_plan.json":plan,"f1_pit_snapshot.json":s.model_dump(mode="json"),
            "f1_e4_run_manifest.json":manifest.model_dump(mode="json"),"f1_provider_metadata_evidence.json":evidence}
          for name,obj in files.items(): (O/name).write_bytes(canonical_json_bytes(obj)+b"\n")
          assert sha256_hex(D+canonical_json_bytes(payload))==h
          assert PitUniverseSnapshot.model_validate_json((O/"f1_pit_snapshot.json").read_bytes()).snapshot_hash==s.snapshot_hash
          assert RunManifest.model_validate_json((O/"f1_e4_run_manifest.json").read_bytes()).manifest_hash==manifest.manifest_hash
          summary={"F1_PLAN_FREEZE":"PASS","target_sha":sha,"target_tree":tree,"market_id":mid,"instrument_id":iid,"bar_type":bar,
            "metadata_hash":m.metadata_hash,"pit_snapshot_hash":s.snapshot_hash,"e4_manifest_hash":manifest.manifest_hash,"acquisition_plan_hash":h,
            "history_end_ms":end,"page_counts":[p["expected_count"] for p in pages],"proof_workflow_head":ph,"proof_pr_number":pr}
          (O/"summary.json").write_bytes(canonical_json_bytes(summary)+b"\n"); print(json.dumps(summary,sort_keys=True))
          PY
          rc=$?; printf '%s\n' "${rc}" >"${OUT}/builder.exit_code"
          cat "${OUT}/builder.stdout" || true; cat "${OUT}/builder.stderr" >&2 || true; exit "${rc}"

      - name: Assert exact F1 plan freeze
        if: always()
        env:
          OUT: ${{ runner.temp }}/formal-g4-t2-f1-plan
        run: |
          set -euo pipefail
          test "$(cat "${OUT}/builder.exit_code")" = "0"
          /tmp/trader-assist-g4-venv/bin/python -m json.tool "${OUT}/summary.json"

      - name: Preserve exact F1 plan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-g4-t2-f1-plan-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/formal-g4-t2-f1-plan
          if-no-files-found: error
          retention-days: 14

      - name: Focused G4 deterministic gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_vnext_g4_contracts.py \
            tests/test_vnext_g4_evaluator.py \
            tests/test_vnext_g4_reporting.py \
            tests/test_nautilus_vnext_g4_catalog_bridge.py \
            tests/test_nautilus_vnext_g4_runner.py
      - name: E4 source-authority regressions
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_e4_contracts.py \
            tests/test_nautilus_e4_capture.py
      - name: E3 structural-reference regressions
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_pilot_contracts.py
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_nautilus_pilot_version_contract.py
      - name: Static gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m ruff check \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          /tmp/trader-assist-g4-venv/bin/python -m mypy \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py
          /tmp/trader-assist-g4-venv/bin/python -m compileall -q \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          test "$(sha256sum src/trader_assist_v0/vnext_g4/evaluator.py | cut -d' ' -f1)" = \
            "63e44fcefdbb714267a293e823aa5114bc705a5f220b1db3834f4706521a4c18"
          git diff --check
      - name: Same-job bounded zero-write public E4 probe
        id: public_e4_probe
        continue-on-error: true
        run: |
          set +e
          E4_EXACT_HEAD="$(git rev-parse HEAD)" \
          E4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          timeout 150s /tmp/trader-assist-g4-venv/bin/python \
            scripts/e4_nautilus_public_data_probe.py \
            --evidence-path "${RUNNER_TEMP}/g4-same-job-e4-evidence" \
            --result-path "${RUNNER_TEMP}/g4-same-job-e4-result.json" \
            --ci-instrument-id ETH-USD-PERP.HYPERLIQUID \
            --provider-coin ETH \
            --run-seconds 90
          probe_exit=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/g4-same-job-e4-result.json" ]; then
            printf '{"schema_version":"E4_PUBLIC_PROVIDER_PROBE_RESULT_V1","status":"HARNESS_INFRASTRUCTURE_FAILURE","failure_class":"HARNESS_OR_INFRASTRUCTURE_FAILURE","probe_exit_code":%s}\n' \
              "${probe_exit}" > "${RUNNER_TEMP}/g4-same-job-e4-result.json"
          fi
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/g4-same-job-e4-result.json"
          exit "${probe_exit}"
      - name: Preserve same-job public E4 evidence
        if: ${{ always() && steps.public_e4_probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g4-same-job-e4-public-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/g4-same-job-e4-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Formal G4 technical qualification
        run: |
          G4_EXACT_HEAD="$(git rev-parse HEAD)" \
          G4_EXACT_TREE="$(git rev-parse 'HEAD^{tree}')" \
          /tmp/trader-assist-g4-venv/bin/python \
            scripts/nautilus_vnext_g4_qualification.py \
            --e4-probe-result "${RUNNER_TEMP}/g4-same-job-e4-result.json" \
            --result-path "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/vnext-formal-g4-qualification.json"
      - name: Assert truthful bounded result
        run: |
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "vnext-formal-g4-qualification.json").read_text()
          )
          assert result["status"] == "TECHNICAL_G4_PARTIAL", result
          assert result["nautilus_version"] == "2.0.0rc5", result
          assert result["g4e0_contract_identity"] == "PASS", result
          assert result["g4e1_deterministic_causal_replay"] == "NOT_PROVEN", result
          assert result["g4e2_vnext_decision_parity"] == "NOT_PROVEN", result
          assert result["g4e3_explicit_execution_model"] == "PASS", result
          assert result["g4e4_candidate_state_isolation"] == "PASS", result
          assert result["g4e5_fill_fee_outcome_report_parity"] == "NOT_PROVEN", result
          assert result["g4e6_zero_write_live_path_composition"] == (
              "PASS_REQUIRES_EXACT_HEAD_E4_CI"
          ), result
          assert result["g4e7_reconnect_restart_nonregression"] == "NOT_PROVEN", result
          assert result["g4e8_representative_scale_runtime"] == "NOT_PROVEN", result
          assert result["formal_g4_technical_acceptance"] is False, result
          assert result["representative_scale_boundary"] >= 20, result
          assert result["representative_evidence_supplied"] is False, result
          assert result["actual_representative_market_count"] == 0, result
          assert result["backtest_node_catalog_surface"] is True, result
          assert result["provider_native_backtest_engine"] is True, result
          assert result["provider_native_fill_model"] is True, result
          assert result["provider_state_source_api"] == "NAUTILUS_CACHE_PORTFOLIO", result
          assert result["controlled_provider_order_count"] > 0, result
          assert result["controlled_provider_filled_order_count"] > 0, result
          assert result["controlled_replay_is_representative_evidence"] is False, result
          assert result["t0_controls_are_formal_causal_proof"] is False, result
          assert result["t0_serializer_restart_identical"] is True, result
          assert result["t2_real_causal_artifact_supplied"] is False, result
          assert result["derived_cache_is_authoritative_market_truth"] is False, result
          assert result["strategy_edge_proven"] is False, result
          assert result["confirmatory_e5_open"] is False, result
          assert result["private_api"] is False, result
          assert result["signing"] is False, result
          assert result["exchange_write"] is False, result
          assert result["venue_submitted"] is False, result
          PY
      - name: Upload Formal G4 qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nautilus-vnext-formal-g4-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/vnext-formal-g4-qualification.json
          if-no-files-found: error
          retention-days: 14
