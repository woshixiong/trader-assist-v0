name: Nautilus Ordinary VNext G4 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vnext-g4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock

      - name: Exact hashed rc5 environment
        run: |
          python -m venv /tmp/trader-assist-g4-venv
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-g4-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
          /tmp/trader-assist-g4-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-g4-venv/bin/python -m pip check

      - name: Exact rc5 provider-native G4 capability surface
        run: |
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          from importlib.metadata import version

          from nautilus_trader.analysis.reporter import ReportProvider
          from nautilus_trader.backtest import (
              BacktestEngineConfig,
              BacktestNode,
              BacktestRunConfig,
              BacktestVenueConfig,
          )
          from nautilus_trader.execution import DefaultFillModel
          from nautilus_trader.persistence import ParquetDataCatalog

          assert version("nautilus-trader") == "2.0.0rc5"
          assert callable(BacktestNode)
          assert callable(BacktestRunConfig)
          assert callable(BacktestVenueConfig)
          assert callable(BacktestEngineConfig)
          assert callable(DefaultFillModel)
          assert callable(ParquetDataCatalog)
          assert ReportProvider is not None
          PY

      - name: Focused Ordinary VNext G4 gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m pytest -q \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py

      - name: Static gates
        run: |
          /tmp/trader-assist-g4-venv/bin/python -m ruff check \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          /tmp/trader-assist-g4-venv/bin/python -m mypy \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py
          /tmp/trader-assist-g4-venv/bin/python -m compileall -q \
            src/trader_assist_v0/vnext_g4 \
            src/trader_assist_v0/nautilus_g4 \
            scripts/nautilus_vnext_g4_qualification.py \
            tests/test_vnext_g4_*.py \
            tests/test_nautilus_vnext_g4_*.py
          git diff --check

      - name: Bounded public E4 source proof for G4 composition
        id: public_source
        continue-on-error: true
        run: |
          set +e
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          E4_EXACT_HEAD="${HEAD_SHA}" \
          E4_EXACT_TREE="${TREE_SHA}" \
          timeout 150s /tmp/trader-assist-g4-venv/bin/python \
            scripts/e4_nautilus_public_data_probe.py \
            --evidence-path "${RUNNER_TEMP}/g4-e4-source" \
            --result-path "${RUNNER_TEMP}/g4-e4-source-result.json" \
            --ci-instrument-id ETH-USD-PERP.HYPERLIQUID \
            --provider-coin ETH \
            --run-seconds 90
          exit_code=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/g4-e4-source-result.json" ]; then
            printf '{"schema_version":"E4_PUBLIC_PROVIDER_PROBE_RESULT_V1","status":"HARNESS_INFRASTRUCTURE_FAILURE","probe_exit_code":%s}\n' \
              "${exit_code}" > "${RUNNER_TEMP}/g4-e4-source-result.json"
          fi
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/g4-e4-source-result.json"
          exit "${exit_code}"

      - name: Run 20-market G4 technical qualification
        id: g4_qualification
        if: ${{ steps.public_source.outcome == 'success' }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          /tmp/trader-assist-g4-venv/bin/python \
            scripts/nautilus_vnext_g4_qualification.py \
            --evidence-path "${RUNNER_TEMP}/g4-e4-source" \
            --derived-cache-path "${RUNNER_TEMP}/g4-derived-cache" \
            --result-path "${RUNNER_TEMP}/g4-qualification-result.json" \
            --exact-head "${HEAD_SHA}" \
            --exact-tree "${TREE_SHA}"
          /tmp/trader-assist-g4-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/g4-qualification-result.json"

      - name: Preserve G4 qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vnext-g4-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g4-e4-source-result.json
            ${{ runner.temp }}/g4-qualification-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Assert G4 authoritative boundaries
        if: ${{ always() }}
        run: |
          /tmp/trader-assist-g4-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          public_path = root / "g4-e4-source-result.json"
          g4_path = root / "g4-qualification-result.json"
          assert public_path.exists(), "missing public source result"
          public = json.loads(public_path.read_text())
          assert public["status"] == "PASS", public
          assert public["nautilus_version"] == "2.0.0rc5", public
          assert public["zero_credentials"] is True, public
          assert public["zero_execution_client"] is True, public
          assert public["zero_signing"] is True, public
          assert public["zero_exchange_write"] is True, public
          assert g4_path.exists(), "missing G4 qualification result"
          g4 = json.loads(g4_path.read_text())
          assert g4["status"] == "PASS", g4
          assert g4["representative_market_count"] == 20, g4
          assert g4["representative_scale_role"] == "TECHNICAL_MECHANICS_ONLY", g4
          assert g4["candidate_state_isolated"] is True, g4
          assert g4["derived_catalog_rebuildable"] is True, g4
          assert g4["derived_catalog_authoritative_market_truth"] is False, g4
          assert g4["source_e4_evidence_mutated"] is False, g4
          assert g4["implicit_fill_defaults"] is False, g4
          assert g4["strategy_edge_claim"] is False, g4
          assert g4["pre_e5_confirmatory_evidence_open"] is False, g4
          zero = g4["zero_write_proof"]
          assert zero["private_api"] is False, zero
          assert zero["signing"] is False, zero
          assert zero["exchange_write"] is False, zero
          assert zero["venue_submitted"] is False, zero
          PY
