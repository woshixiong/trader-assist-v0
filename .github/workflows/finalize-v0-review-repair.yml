name: Finalize verified V0 review repair

on:
  push:
    branches:
      - feature/v0-00-bootstrap-contracts

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: diagnose verified V0 repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply, validate, and finalize or record diagnostics
        shell: bash
        run: |
          set +e
          {
            set -x
            base64 --decode .github/repair-payload/v0-repair.tar.xz.b64 > /tmp/v0-repair.tar.xz
            echo "0897f077d3299a4d7b85f7d0b0e286c35d4339798a606bb69b17f2443d9e8f2a  /tmp/v0-repair.tar.xz" | sha256sum -c -
            tar -xJf /tmp/v0-repair.tar.xz -C .
            python -m pip install -r requirements-runtime.lock -r requirements-dev.lock
            python -m pip install -e . --no-deps --no-build-isolation
            python scripts/check_dependency_lock.py
            python -m pip check
            pip-audit --strict -r requirements-runtime.lock
            python -m compileall -q src scripts tests
            python scripts/export_schemas.py --check
            python scripts/scan_secrets.py .
            ruff check .
            mypy src scripts
            pytest -q
            git diff --check
          } > /tmp/v0-repair.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm -rf .github/repair-payload
            rm -f .github/repair-diagnostic.txt
            rm -f .github/workflows/apply-v0-review-repair.yml
            rm -f .github/workflows/finalize-v0-review-repair.yml
            git add -A
            git commit -m "fix: close remaining V0 contract authority blockers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit 0
          fi

          git reset --hard HEAD
          {
            echo "V0 repair validation failed. Tail of bounded, non-secret validation log:"
            echo
            tail -n 400 /tmp/v0-repair.log
          } > .github/repair-diagnostic.txt
          git add .github/repair-diagnostic.txt
          git commit -m "chore: record V0 repair diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1
