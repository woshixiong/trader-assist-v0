name: Nautilus rc5 qualification CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc5-qualification:
    runs-on: ubuntu-24.04
    env:
      RC5_VERSION: "2.0.0rc5"
      RC5_WHEEL_SHA256: "eab45fafd2312deda1236554c49a9798bfc76bc8465af864878e2f70189ebebe"
      QUALIFICATION_BASE: "b0b13cb179c4f9d54ce568443fe404c2cd2ae2de"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Q8 qualification scope guard
        run: |
          python - <<'PY'
          import subprocess

          base = "b0b13cb179c4f9d54ce568443fe404c2cd2ae2de"
          expected = {
              ".github/workflows/nautilus-rc5-qualification-ci.yml",
              "scripts/nautilus_rc5_public_data_probe.py",
              "tests/test_nautilus_rc5_qualification.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
              ).splitlines()
          )
          assert changed == expected, {"expected": sorted(expected), "changed": sorted(changed)}
          PY
          git diff --check "${QUALIFICATION_BASE}...HEAD"

      - name: Build isolated rc5 qualification environment
        run: |
          python -m venv /tmp/trader-assist-rc5q-venv
          /tmp/trader-assist-rc5q-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          mkdir -p "${RUNNER_TEMP}/rc5-wheel"
          /tmp/trader-assist-rc5q-venv/bin/python -m pip download \
            --only-binary=:all: --no-deps \
            --dest "${RUNNER_TEMP}/rc5-wheel" \
            "nautilus-trader==${RC5_VERSION}"
          wheel="$(find "${RUNNER_TEMP}/rc5-wheel" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          test "$(find "${RUNNER_TEMP}/rc5-wheel" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          actual_sha="$(sha256sum "${wheel}" | awk '{print $1}')"
          test "${actual_sha}" = "${RC5_WHEEL_SHA256}"
          cp "${wheel}" "${RUNNER_TEMP}/nautilus-rc5-qualified.whl"
          /tmp/trader-assist-rc5q-venv/bin/python -m pip install --no-deps "${wheel}"
          /tmp/trader-assist-rc5q-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation

      - name: Q1 exact rc5 artifact and platform identity
        run: |
          /tmp/trader-assist-rc5q-venv/bin/python - <<'PY'
          import json
          import platform
          import sys
          from importlib.metadata import version
          from pathlib import Path

          assert sys.version_info[:2] == (3, 12), sys.version
          assert platform.system() == "Linux", platform.system()
          assert platform.machine() == "x86_64", platform.machine()
          assert version("nautilus-trader") == "2.0.0rc5"
          payload = {
              "schema_version": "RC5_QUALIFICATION_ARTIFACT_IDENTITY_V1",
              "nautilus_version": version("nautilus-trader"),
              "wheel_sha256": "eab45fafd2312deda1236554c49a9798bfc76bc8465af864878e2f70189ebebe",
              "python": platform.python_version(),
              "platform": f"{platform.system()}-{platform.machine()}",
              "qualification_only": True,
          }
          Path("/tmp/rc5-artifact-identity.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Q2-Q5 and Q7 deterministic qualification
        run: |
          /tmp/trader-assist-rc5q-venv/bin/python -m pytest -q \
            tests/test_nautilus_rc5_qualification.py

      - name: Qualification static gates
        run: |
          /tmp/trader-assist-rc5q-venv/bin/python -m ruff check \
            scripts/nautilus_rc5_public_data_probe.py \
            tests/test_nautilus_rc5_qualification.py
          /tmp/trader-assist-rc5q-venv/bin/python -m compileall -q \
            scripts/nautilus_rc5_public_data_probe.py \
            tests/test_nautilus_rc5_qualification.py
          git diff --check "${QUALIFICATION_BASE}...HEAD"

      - name: Q6 bounded zero-credential Hyperliquid public-provider proof
        id: rc5_provider_probe
        continue-on-error: true
        run: |
          set +e
          timeout 150s /tmp/trader-assist-rc5q-venv/bin/python \
            scripts/nautilus_rc5_public_data_probe.py \
            --evidence-path "${RUNNER_TEMP}/rc5-public-evidence" \
            --result-path "${RUNNER_TEMP}/rc5-public-provider-result.json" \
            --instrument-id ETH-USD-PERP.HYPERLIQUID \
            --run-seconds 90 \
            --exact-head "$(git rev-parse HEAD)" \
            --exact-tree "$(git rev-parse 'HEAD^{tree}')"
          probe_exit=$?
          set -e
          if [ ! -s "${RUNNER_TEMP}/rc5-public-provider-result.json" ]; then
            printf '{"schema_version":"RC5_QUALIFICATION_PUBLIC_PROVIDER_RESULT_V1","status":"HARNESS_INFRASTRUCTURE_FAILURE","failure_class":"HARNESS_OR_INFRASTRUCTURE_FAILURE","probe_exit_code":%s}\n' \
              "${probe_exit}" > "${RUNNER_TEMP}/rc5-public-provider-result.json"
          fi
          /tmp/trader-assist-rc5q-venv/bin/python -m json.tool \
            "${RUNNER_TEMP}/rc5-public-provider-result.json"
          exit "${probe_exit}"

      - name: Assert authoritative rc5 public-provider observation
        if: ${{ always() && steps.rc5_provider_probe.outcome != 'skipped' }}
        run: |
          /tmp/trader-assist-rc5q-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "rc5-public-provider-result.json").read_text()
          )
          assert result["status"] == "PASS", result
          assert result["nautilus_version"] == "2.0.0rc5", result
          assert result["qualification_only"] is True, result
          assert result["zero_credentials"] is True, result
          assert result["zero_execution_client"] is True, result
          assert result["zero_signing"] is True, result
          assert result["zero_exchange_write"] is True, result
          observation = result["observation"]
          assert observation["quote_observed"] is True, observation
          assert observation["trade_observed"] is True, observation
          assert observation["finalized_bar_callback_observed"] is True, observation
          assert observation["finalized_bar_evidence_persisted"] is True, observation
          PY

      - name: Build Q1-Q8 qualification summary
        if: ${{ always() }}
        run: |
          /tmp/trader-assist-rc5q-venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          provider_path = temp / "rc5-public-provider-result.json"
          provider = json.loads(provider_path.read_text()) if provider_path.exists() else None
          payload = {
              "schema_version": "RC5_ONE_BLOCKER_QUALIFICATION_SUMMARY_V1",
              "qualification_only": True,
              "exact_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "exact_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "accepted_rc4_base": "b0b13cb179c4f9d54ce568443fe404c2cd2ae2de",
              "target_nautilus_version": "2.0.0rc5",
              "wheel_sha256": "eab45fafd2312deda1236554c49a9798bfc76bc8465af864878e2f70189ebebe",
              "provider_result": provider,
              "interpretation": "QUALIFICATION_ONLY_NOT_ADOPTION",
          }
          (temp / "rc5-qualification-summary.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Preserve rc5 qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc5-one-blocker-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/rc5-artifact-identity.json
            ${{ runner.temp }}/rc5-public-provider-result.json
            ${{ runner.temp }}/rc5-qualification-summary.json
          if-no-files-found: error
          retention-days: 14
