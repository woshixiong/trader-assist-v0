name: PR151 exact-head public G9 rehearsal

on:
  push:
    branches:
      - ops/pr151-public-g9-16d967c7-20260903

permissions:
  contents: read

jobs:
  public-g9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 16d967c7d27f21dcc95c146f45d2873b3e496752
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock

      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PUBLIC_G9_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "PUBLIC_G9_TREE=$(git rev-parse HEAD^{tree})"

      - name: Hashed locked install
        run: |
          python -m venv /tmp/trader-assist-v0-g9-venv
          /tmp/trader-assist-v0-g9-venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-v0-g9-venv/bin/python -m pip install -e . --no-deps --no-build-isolation

      - name: Dependency closure
        run: |
          /tmp/trader-assist-v0-g9-venv/bin/python scripts/check_dependency_lock.py --verify-installed
          /tmp/trader-assist-v0-g9-venv/bin/python -m pip check

      - name: Public G9 full-application rehearsal
        env:
          TRADE_OS_RUN_HYPERLIQUID_FULL_APPLICATION: "1"
          TRADE_OS_PUBLIC_REHEARSAL_RELEASE_SHA: "16d967c7d27f21dcc95c146f45d2873b3e496752"
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/trader-assist-v0-g9-venv/bin/pytest -q -s \
            tests/test_multi_asset_shadow_hyperliquid_live_ws_contract.py::test_public_provider_rehearsal_drives_full_three_setup_application

      - name: Final exact identity
        if: always()
        run: |
          echo "PUBLIC_G9_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "PUBLIC_G9_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git status --short
