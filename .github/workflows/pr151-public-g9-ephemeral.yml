name: PR151 exact-head public G9 warmup response isolation

on:
  push:
    branches:
      - ops/pr151-public-g9-16d967c7-20260903

permissions:
  contents: read

jobs:
  public-g9-warmup-response-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 16d967c7d27f21dcc95c146f45d2873b3e496752
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock

      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "WARMUP_TRACE_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "WARMUP_TRACE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Hashed locked install
        run: |
          python -m venv /tmp/trader-assist-v0-g9warmup-venv
          /tmp/trader-assist-v0-g9warmup-venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-v0-g9warmup-venv/bin/python -m pip install -e . --no-deps --no-build-isolation
          /tmp/trader-assist-v0-g9warmup-venv/bin/python scripts/check_dependency_lock.py --verify-installed
          /tmp/trader-assist-v0-g9warmup-venv/bin/python -m pip check

      - name: Exact provider warmup response trace
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/trader-assist-v0-g9warmup-venv/bin/python - <<'PY'
          import asyncio
          import hashlib
          import json
          import tempfile
          from datetime import UTC, datetime
          from decimal import Decimal
          from pathlib import Path

          from scripts.build_multi_asset_registry_seed import build_seed
          from trader_assist_v0.multi_asset_shadow import hyperliquid_public as hp
          from trader_assist_v0.multi_asset_shadow import production
          from trader_assist_v0.multi_asset_shadow.hyperliquid_public import HyperliquidPublicClient, OfficialMetadataValidator
          from trader_assist_v0.multi_asset_shadow.models import MarketLifecycle, RegistryVersion
          from trader_assist_v0.multi_asset_shadow.notification_engine import WebhookConfig, WebhookDeliveryAdapter, WebhookResponse
          from trader_assist_v0.multi_asset_shadow.planning import CostModel
          from trader_assist_v0.multi_asset_shadow.registry import MarketRegistryManager

          CANDIDATE = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          FIVE = 300_000
          WARMUP_BARS = 2_304

          def trace_post(url: str, body: bytes, timeout_seconds: float) -> bytes:
              raw = hp._default_post(url, body, timeout_seconds)
              try:
                  request = json.loads(body)
              except Exception:
                  return raw
              if request.get("type") != "candleSnapshot":
                  return raw
              req = request.get("req") if isinstance(request.get("req"), dict) else {}
              try:
                  response = json.loads(raw)
              except Exception:
                  response = None
              if isinstance(response, list):
                  times = [item.get("t") for item in response if isinstance(item, dict) and isinstance(item.get("t"), int)]
                  closes = [item.get("T") for item in response if isinstance(item, dict) and isinstance(item.get("T"), int)]
                  summary = {
                      "coin": req.get("coin"),
                      "interval": req.get("interval"),
                      "start_ms": req.get("startTime"),
                      "end_ms": req.get("endTime"),
                      "count": len(response),
                      "first_t": min(times) if times else None,
                      "last_t": max(times) if times else None,
                      "last_T": max(closes) if closes else None,
                      "response_sha256": hashlib.sha256(raw).hexdigest(),
                  }
              else:
                  summary = {
                      "coin": req.get("coin"),
                      "interval": req.get("interval"),
                      "start_ms": req.get("startTime"),
                      "end_ms": req.get("endTime"),
                      "response_type": type(response).__name__,
                      "response_sha256": hashlib.sha256(raw).hexdigest(),
                  }
              print("WARMUP_RAW_RESPONSE=" + json.dumps(summary, sort_keys=True, separators=(",", ":")), flush=True)
              return raw

          class NoNetworkNotificationClient:
              def post(self, **_):
                  return WebhookResponse(204)

          async def main() -> None:
              with tempfile.TemporaryDirectory(prefix="trade-os-g9warmup-") as td:
                  state = Path(td) / "state"
                  production.THREE_SETUP_STATE_ROOT = state
                  production.THREE_SETUP_EVIDENCE_STORE_PATH = state / "evidence.sqlite"
                  production.THREE_SETUP_REGISTRY_ROOT = state / "registry"
                  production.THREE_SETUP_CLOSED_BAR_STORE_PATH = state / "closed-bars.sqlite"

                  client = HyperliquidPublicClient(post=trace_post)
                  observed_at = datetime.now(UTC)
                  seed = build_seed(
                      version=f"g9warmup-source-{CANDIDATE[:12]}",
                      observed_at=observed_at,
                      client=client,
                  )
                  active_seed = RegistryVersion.create(
                      version=f"g9warmup-active-{CANDIDATE[:12]}",
                      created_at=observed_at,
                      markets=tuple(
                          market.model_copy(update={"lifecycle": MarketLifecycle.ACTIVE})
                          for market in seed.markets
                      ),
                  )
                  registry = MarketRegistryManager(
                      production.THREE_SETUP_REGISTRY_ROOT,
                      metadata_validator=OfficialMetadataValidator(client),
                  )
                  registry.stage(active_seed)
                  registry.request_apply(active_seed.version)
                  adapter = WebhookDeliveryAdapter(
                      client=NoNetworkNotificationClient(),
                      config=WebhookConfig(url="https://example.invalid/no-network"),
                  )
                  config = production.ThreeSetupProductionConfig(
                      release_sha=CANDIDATE,
                      evidence_store_path=production.THREE_SETUP_EVIDENCE_STORE_PATH,
                      registry_root=production.THREE_SETUP_REGISTRY_ROOT,
                      closed_bar_store_path=production.THREE_SETUP_CLOSED_BAR_STORE_PATH,
                      cost_model=CostModel("g9warmup", Decimal(), Decimal(), Decimal("2")),
                      acknowledgement_timeout_seconds=30,
                      notification_poll_seconds=1,
                  )
                  application = production.compose_three_setup_application(
                      config=config,
                      notification_adapter=adapter,
                      public_client=client,
                  )
                  runtime = application.bootstrap.runtime
                  market = runtime.selected_markets()[0]
                  initial_boundary = runtime._latest_completed_open()
                  target = initial_boundary - FIVE
                  expected_start = target + FIVE - WARMUP_BARS * FIVE
                  print("WARMUP_TRACE_REQUEST=" + json.dumps({
                      "display": market.display,
                      "coin": market.identity.coin,
                      "initial_boundary": initial_boundary,
                      "target": target,
                      "expected_start": expected_start,
                      "expected_end": target + FIVE,
                      "observed_at_ms": int(datetime.now(UTC).timestamp() * 1000),
                  }, sort_keys=True, separators=(",", ":")), flush=True)
                  try:
                      admitted = await runtime._warmup_market(
                          market,
                          recovery=True,
                          target_open_ms=target,
                      )
                  except Exception as exc:
                      print("WARMUP_TRACE_FAILURE=" + json.dumps({
                          "error_type": type(exc).__name__,
                          "reason": str(exc),
                          "store_last_open": application.bootstrap.data_authority.store.last_open(market.identity.market_id),
                          "authority_market_failed": application.bootstrap.data_authority.market_failed(market.identity.market_id),
                          "runtime_failed": market.identity.market_id in runtime.health.failed_markets,
                          "runtime_recoverable": market.identity.market_id in runtime.health.recoverable_markets,
                          "runtime_nonrecoverable": market.identity.market_id in runtime.health.nonrecoverable_markets,
                      }, sort_keys=True, separators=(",", ":")), flush=True)
                      raise
                  else:
                      print("WARMUP_TRACE_SUCCESS=" + json.dumps({
                          "admitted": admitted,
                          "store_last_open": application.bootstrap.data_authority.store.last_open(market.identity.market_id),
                          "target": target,
                      }, sort_keys=True, separators=(",", ":")), flush=True)
                  finally:
                      application.bootstrap.close()
                      application.bootstrap.data_authority.store.close()

          asyncio.run(main())
          PY

      - name: Final exact identity
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          echo "WARMUP_TRACE_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "WARMUP_TRACE_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git status --short
