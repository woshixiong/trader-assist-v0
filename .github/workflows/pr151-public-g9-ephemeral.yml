name: PR151 exact-head public G9 stage trace

on:
  push:
    branches:
      - ops/pr151-public-g9-16d967c7-20260903

permissions:
  contents: read

jobs:
  public-g9-stage-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 16d967c7d27f21dcc95c146f45d2873b3e496752
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock

      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "G9_STAGE_TRACE_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "G9_STAGE_TRACE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Hashed locked install
        run: |
          python -m venv /tmp/trader-assist-v0-g9stage-venv
          /tmp/trader-assist-v0-g9stage-venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-v0-g9stage-venv/bin/python -m pip install -e . --no-deps --no-build-isolation
          /tmp/trader-assist-v0-g9stage-venv/bin/python scripts/check_dependency_lock.py --verify-installed
          /tmp/trader-assist-v0-g9stage-venv/bin/python -m pip check

      - name: Pinpoint first ACTIVE boundary stall
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/trader-assist-v0-g9stage-venv/bin/python - <<'PY'
          import asyncio
          import inspect
          import json
          import os
          import tempfile
          import threading
          import time
          from collections import Counter
          from collections.abc import Awaitable
          from datetime import UTC, datetime
          from decimal import Decimal
          from pathlib import Path

          from scripts.build_multi_asset_registry_seed import build_seed
          from trader_assist_v0.multi_asset_shadow import production
          from trader_assist_v0.multi_asset_shadow.bootstrap import BoundaryReport
          from trader_assist_v0.multi_asset_shadow.hyperliquid_public import HyperliquidPublicClient, OfficialMetadataValidator
          from trader_assist_v0.multi_asset_shadow.models import MarketLifecycle
          from trader_assist_v0.multi_asset_shadow.notification_engine import WebhookConfig, WebhookDeliveryAdapter, WebhookResponse
          from trader_assist_v0.multi_asset_shadow.planning import CostModel
          from trader_assist_v0.multi_asset_shadow.registry import MarketRegistryManager
          from trader_assist_v0.multi_asset_shadow.runtime import BoundaryMode, classify_retained_boundary

          CANDIDATE = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          MAX_SECONDS = 1500.0
          ACTIVE_WATCHDOG_SECONDS = 90.0

          class NoNetworkNotificationClient:
              def post(self, **_):
                  return WebhookResponse(204)

          async def main():
              with tempfile.TemporaryDirectory(prefix="trade-os-g9stage-") as td:
                  state = Path(td) / "state"
                  production.THREE_SETUP_STATE_ROOT = state
                  production.THREE_SETUP_EVIDENCE_STORE_PATH = state / "evidence.sqlite"
                  production.THREE_SETUP_REGISTRY_ROOT = state / "registry"
                  production.THREE_SETUP_CLOSED_BAR_STORE_PATH = state / "closed-bars.sqlite"

                  client = HyperliquidPublicClient()
                  seed = build_seed(
                      version=f"g9stage-{CANDIDATE[:12]}",
                      observed_at=datetime.now(UTC),
                      client=client,
                  )
                  assert len(seed.markets) == 20
                  registry = MarketRegistryManager(
                      production.THREE_SETUP_REGISTRY_ROOT,
                      metadata_validator=OfficialMetadataValidator(client),
                  )
                  registry.stage(seed)
                  registry.request_apply(seed.version)
                  adapter = WebhookDeliveryAdapter(
                      client=NoNetworkNotificationClient(),
                      config=WebhookConfig(url="https://example.invalid/no-network"),
                  )
                  config = production.ThreeSetupProductionConfig(
                      release_sha=CANDIDATE,
                      evidence_store_path=production.THREE_SETUP_EVIDENCE_STORE_PATH,
                      registry_root=production.THREE_SETUP_REGISTRY_ROOT,
                      closed_bar_store_path=production.THREE_SETUP_CLOSED_BAR_STORE_PATH,
                      cost_model=CostModel("g9stage", Decimal(), Decimal(), Decimal("2")),
                      acknowledgement_timeout_seconds=30,
                      notification_poll_seconds=1,
                  )
                  application = production.compose_three_setup_application(
                      config=config,
                      notification_adapter=adapter,
                      public_client=client,
                  )
                  bootstrap = application.bootstrap
                  runtime = bootstrap.runtime
                  coordinator = bootstrap.coordinator
                  outcome = bootstrap.outcome_engine
                  provider = outcome.provider
                  active_trace = {"enabled": False, "boundary": None}

                  def emit(kind, name, **fields):
                      if not active_trace["enabled"]:
                          return
                      payload = {
                          "kind": kind,
                          "stage": name,
                          "boundary": active_trace["boundary"],
                          "mono": round(time.monotonic(), 3),
                          **fields,
                      }
                      print("G9_STAGE=" + json.dumps(payload, sort_keys=True, separators=(",", ":")), flush=True)

                  def wrap_sync(obj, name):
                      if obj is None or not hasattr(obj, name):
                          return
                      original = getattr(obj, name)
                      if inspect.iscoroutinefunction(original):
                          raise RuntimeError(f"expected sync method: {name}")
                      def wrapped(*args, **kwargs):
                          emit("ENTER", name)
                          started = time.monotonic()
                          try:
                              value = original(*args, **kwargs)
                              emit("EXIT", name, elapsed_ms=int((time.monotonic() - started) * 1000))
                              return value
                          except BaseException as exc:
                              emit("ERROR", name, elapsed_ms=int((time.monotonic() - started) * 1000), error_type=type(exc).__name__, reason=str(exc)[:300])
                              raise
                      setattr(obj, name, wrapped)

                  def wrap_async(obj, name):
                      if obj is None or not hasattr(obj, name):
                          return
                      original = getattr(obj, name)
                      if not inspect.iscoroutinefunction(original):
                          raise RuntimeError(f"expected async method: {name}")
                      async def wrapped(*args, **kwargs):
                          emit("ENTER", name)
                          started = time.monotonic()
                          try:
                              value = await original(*args, **kwargs)
                              emit("EXIT", name, elapsed_ms=int((time.monotonic() - started) * 1000))
                              return value
                          except BaseException as exc:
                              emit("ERROR", name, elapsed_ms=int((time.monotonic() - started) * 1000), error_type=type(exc).__name__, reason=str(exc)[:300])
                              raise
                      setattr(obj, name, wrapped)

                  for obj, name in (
                      (runtime, "_run_live_finality_lane"),
                      (runtime, "_notify_finalized"),
                      (bootstrap, "_scanner_snapshots"),
                      (bootstrap, "_process_pending"),
                      (bootstrap, "advance_outcomes_async"),
                  ):
                      wrap_async(obj, name)

                  for obj, name in (
                      (runtime, "_whole_cohort_actionable"),
                      (coordinator, "retained_scanner_run"),
                      (coordinator, "scan_finalized"),
                      (coordinator, "compose_scanner_market"),
                      (coordinator, "strategy_recovery_boundaries"),
                      (coordinator, "prepare_finalized_market"),
                      (coordinator, "evaluate_finalized_market"),
                      (coordinator, "commit_evaluation_cohort"),
                      (coordinator, "pending_formal_decisions"),
                      (coordinator, "process_retained_formal_decision"),
                      (outcome, "recovery_requests"),
                      (outcome, "tick"),
                      (provider, "raw_read_1m"),
                  ):
                      wrap_sync(obj, name)

                  real_callback = runtime.on_finalized_5m
                  real_process = runtime.process_cohort_boundary
                  assert real_callback is not None
                  done = asyncio.Event()
                  result_holder = {}

                  async def observe(bar, mode):
                      emit("ENTER", "production_on_finalized_5m", mode=mode.value)
                      started = time.monotonic()
                      value = real_callback(bar, mode)
                      report = await value if isinstance(value, Awaitable) else value
                      assert isinstance(report, BoundaryReport)
                      emit(
                          "EXIT",
                          "production_on_finalized_5m",
                          elapsed_ms=int((time.monotonic() - started) * 1000),
                          scanner=report.scanner_run_count,
                          strategy_markets=len(report.evaluated_market_ids),
                          failure_count=len(report.failures),
                      )
                      result_holder["report"] = {
                          "boundary": report.boundary_open_time_ms,
                          "mode": report.evaluation_mode.value,
                          "scanner": report.scanner_run_count,
                          "strategy_markets": len(report.evaluated_market_ids),
                          "failure_count": len(report.failures),
                      }
                      return report

                  async def traced_process(boundary):
                      selected = runtime.selected_markets()
                      lifecycle = Counter(m.lifecycle.value for m in selected)
                      active = registry.active()
                      classes = Counter()
                      last_opens = {}
                      if active is not None:
                          for market in selected:
                              mid = market.identity.market_id
                              last_opens[mid] = bootstrap.data_authority.store.last_open(mid)
                              classes[classify_retained_boundary(
                                  store=bootstrap.data_authority.store,
                                  registry=registry,
                                  market_id=mid,
                                  boundary_open_ms=boundary,
                                  captured_version=active.version,
                                  captured_hash=active.content_hash,
                              ).value] += 1
                      is_active = lifecycle.get(MarketLifecycle.ACTIVE.value, 0) == 20
                      pre = {
                          "boundary": boundary,
                          "lifecycle": dict(sorted(lifecycle.items())),
                          "classes": dict(sorted(classes.items())),
                          "data_ready": runtime.health.data_ready,
                          "ack": len(runtime.health.acknowledgements),
                          "last_open_min": min((v for v in last_opens.values() if v is not None), default=None),
                          "last_open_max": max((v for v in last_opens.values() if v is not None), default=None),
                      }
                      print("G9_BARRIER_PRE=" + json.dumps(pre, sort_keys=True, separators=(",", ":")), flush=True)
                      watchdog = None
                      if is_active:
                          active_trace["enabled"] = True
                          active_trace["boundary"] = boundary
                          def watchdog_fire():
                              emit("WATCHDOG", "ACTIVE_BOUNDARY", elapsed_seconds=ACTIVE_WATCHDOG_SECONDS)
                              os._exit(72)
                          watchdog = threading.Timer(ACTIVE_WATCHDOG_SECONDS, watchdog_fire)
                          watchdog.daemon = True
                          watchdog.start()
                      try:
                          await real_process(boundary)
                      finally:
                          if watchdog is not None:
                              watchdog.cancel()
                      if is_active:
                          diag = None
                          if runtime.health.boundary_diagnostics and runtime.health.boundary_diagnostics[-1].boundary_open_ms == boundary:
                              diag = runtime.health.boundary_diagnostics[-1]
                          result_holder["diagnostic"] = None if diag is None else {
                              "finalized_count": diag.finalized_count,
                              "recoverable_count": diag.recoverable_count,
                              "nonrecoverable_count": diag.nonrecoverable_count,
                              "deadline_count": diag.deadline_count,
                              "whole_cohort_actionable": diag.whole_cohort_actionable,
                              "callback_wake": diag.callback_wake,
                              "request_count": diag.request_count,
                              "live_finality_duration_ms": diag.live_finality_duration_ms,
                          }
                          done.set()

                  runtime.on_finalized_5m = observe
                  runtime.process_cohort_boundary = traced_process
                  shutdown = asyncio.Event()
                  task = asyncio.create_task(application.run(shutdown))
                  started = time.monotonic()
                  try:
                      while time.monotonic() - started < MAX_SECONDS:
                          if task.done():
                              await task
                              break
                          try:
                              await asyncio.wait_for(done.wait(), timeout=30)
                              break
                          except TimeoutError:
                              print("G9_PROGRESS=" + json.dumps({
                                  "elapsed_seconds": round(time.monotonic() - started, 1),
                                  "data_ready": runtime.health.data_ready,
                                  "ws_phase": runtime.health.ws_phase,
                                  "ack": len(runtime.health.acknowledgements),
                                  "diagnostic_count": len(runtime.health.boundary_diagnostics),
                              }, sort_keys=True, separators=(",", ":")), flush=True)
                      print("G9_STAGE_TRACE_FINAL=" + json.dumps({
                          "elapsed_seconds": round(time.monotonic() - started, 1),
                          "result": result_holder,
                          "public_data_only": True,
                          "notification_network_disabled": True,
                          "shadow_order_submitted": False,
                      }, sort_keys=True, separators=(",", ":")), flush=True)
                  finally:
                      shutdown.set()
                      try:
                          await asyncio.wait_for(task, timeout=15)
                      except BaseException:
                          task.cancel()
                          await asyncio.gather(task, return_exceptions=True)

          asyncio.run(main())
          PY

      - name: Final exact identity
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          echo "G9_STAGE_TRACE_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "G9_STAGE_TRACE_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git status --short
