name: PR151 exact-head public active-cohort finality diagnostic

on:
  push:
    branches:
      - ops/pr151-public-g9-16d967c7-20260903

permissions:
  contents: read

jobs:
  active-cohort-finality-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 23f48c64448bd2089ceece0cd1b3038b9b6e6ff1
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock

      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "23f48c64448bd2089ceece0cd1b3038b9b6e6ff1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "DIAG_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "DIAG_TREE=$(git rev-parse HEAD^{tree})"

      - name: Hashed locked install
        run: |
          python -m venv /tmp/trader-assist-v0-public-diag-venv
          /tmp/trader-assist-v0-public-diag-venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-v0-public-diag-venv/bin/python -m pip install -e . --no-deps --no-build-isolation
          /tmp/trader-assist-v0-public-diag-venv/bin/python scripts/check_dependency_lock.py --verify-installed
          /tmp/trader-assist-v0-public-diag-venv/bin/python -m pip check

      - name: Observe first real post-cooldown ACTIVE Target-20 boundary
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/trader-assist-v0-public-diag-venv/bin/python - <<'PY'
          import asyncio
          import json
          import tempfile
          import threading
          import time
          from dataclasses import asdict
          from datetime import UTC, datetime
          from decimal import Decimal
          from pathlib import Path

          from scripts.build_multi_asset_registry_seed import build_seed
          from trader_assist_v0.multi_asset_shadow import hyperliquid_public as hp
          from trader_assist_v0.multi_asset_shadow import production
          from trader_assist_v0.multi_asset_shadow.bootstrap import BoundaryReport
          from trader_assist_v0.multi_asset_shadow.hyperliquid_public import HyperliquidPublicClient, OfficialMetadataValidator
          from trader_assist_v0.multi_asset_shadow.models import MarketLifecycle, RegistryVersion
          from trader_assist_v0.multi_asset_shadow.notification_engine import WebhookConfig, WebhookDeliveryAdapter, WebhookResponse
          from trader_assist_v0.multi_asset_shadow.planning import CostModel
          from trader_assist_v0.multi_asset_shadow.registry import MarketRegistryManager

          CANDIDATE = "23f48c64448bd2089ceece0cd1b3038b9b6e6ff1"
          transport_lock = threading.Lock()
          transport_rows = []

          def timed_post(url: str, body: bytes, timeout_seconds: float) -> bytes:
              started = time.monotonic()
              request_type = "UNKNOWN"
              coin = None
              interval = None
              try:
                  parsed = json.loads(body)
                  request_type = str(parsed.get("type"))
                  req = parsed.get("req") if isinstance(parsed.get("req"), dict) else {}
                  coin = req.get("coin") or parsed.get("coin")
                  interval = req.get("interval")
              except Exception:
                  pass
              outcome = "SUCCESS"
              try:
                  return hp._default_post(url, body, timeout_seconds)
              except Exception as exc:
                  outcome = type(exc).__name__
                  raise
              finally:
                  with transport_lock:
                      transport_rows.append({
                          "type": request_type,
                          "coin": coin,
                          "interval": interval,
                          "elapsed_ms": max(0, int((time.monotonic() - started) * 1000)),
                          "outcome": outcome,
                      })

          class NoNetworkNotificationClient:
              def post(self, **_):
                  return WebhookResponse(204)

          def latency_summary(rows):
              values = sorted(int(row["elapsed_ms"]) for row in rows)
              if not values:
                  return {"count": 0, "success": 0, "fail": 0, "min_ms": None, "p50_ms": None, "p95_ms": None, "max_ms": None}
              return {
                  "count": len(rows),
                  "success": sum(row["outcome"] == "SUCCESS" for row in rows),
                  "fail": sum(row["outcome"] != "SUCCESS" for row in rows),
                  "min_ms": values[0],
                  "p50_ms": values[len(values)//2],
                  "p95_ms": values[min(len(values)-1, int(len(values)*0.95))],
                  "max_ms": values[-1],
              }

          async def main() -> None:
              with tempfile.TemporaryDirectory(prefix="trade-os-active-finality-diag-") as td:
                  state = Path(td) / "state"
                  production.THREE_SETUP_STATE_ROOT = state
                  production.THREE_SETUP_EVIDENCE_STORE_PATH = state / "evidence.sqlite"
                  production.THREE_SETUP_REGISTRY_ROOT = state / "registry"
                  production.THREE_SETUP_CLOSED_BAR_STORE_PATH = state / "closed-bars.sqlite"

                  client = HyperliquidPublicClient(post=timed_post)
                  observed_at = datetime.now(UTC)
                  seed = build_seed(version=f"diag-source-{CANDIDATE[:12]}", observed_at=observed_at, client=client)
                  assert len(seed.markets) == 20
                  active_seed = RegistryVersion.create(
                      version=f"diag-active-{CANDIDATE[:12]}",
                      created_at=observed_at,
                      markets=tuple(m.model_copy(update={"lifecycle": MarketLifecycle.ACTIVE}) for m in seed.markets),
                  )
                  registry = MarketRegistryManager(production.THREE_SETUP_REGISTRY_ROOT, metadata_validator=OfficialMetadataValidator(client))
                  registry.stage(active_seed)
                  registry.request_apply(active_seed.version)
                  sink = NoNetworkNotificationClient()
                  adapter = WebhookDeliveryAdapter(client=sink, config=WebhookConfig(url="https://example.invalid/no-network"))
                  config = production.ThreeSetupProductionConfig(
                      release_sha=CANDIDATE,
                      evidence_store_path=production.THREE_SETUP_EVIDENCE_STORE_PATH,
                      registry_root=production.THREE_SETUP_REGISTRY_ROOT,
                      closed_bar_store_path=production.THREE_SETUP_CLOSED_BAR_STORE_PATH,
                      cost_model=CostModel("active-finality-diag", Decimal(), Decimal(), Decimal("2")),
                      acknowledgement_timeout_seconds=30,
                      notification_poll_seconds=1,
                  )
                  application = production.compose_three_setup_application(config=config, notification_adapter=adapter, public_client=client)
                  runtime = application.bootstrap.runtime
                  reports: list[BoundaryReport] = []
                  real_callback = runtime.on_finalized_5m
                  assert real_callback is not None

                  async def observe(bar, mode):
                      value = real_callback(bar, mode)
                      report = await value if hasattr(value, "__await__") else value
                      assert isinstance(report, BoundaryReport)
                      reports.append(report)
                      return report

                  runtime.on_finalized_5m = observe
                  shutdown = asyncio.Event()
                  task = asyncio.create_task(application.run(shutdown))
                  try:
                      async with asyncio.timeout(540):
                          while not runtime.health.data_ready:
                              if task.done():
                                  await task
                                  raise RuntimeError("application exited before READY")
                              await asyncio.sleep(0.1)
                          active = registry.active()
                          assert active is not None
                          lifecycle_counts = {}
                          for market in active.markets:
                              lifecycle_counts[market.lifecycle.value] = lifecycle_counts.get(market.lifecycle.value, 0) + 1
                          last_opens = [application.bootstrap.data_authority.store.last_open(m.identity.market_id) for m in active.markets]
                          assert all(value is not None for value in last_opens)
                          startup_target = max(int(value) for value in last_opens if value is not None)
                          transport_start = len(transport_rows)
                          print("ACTIVE_DIAG_READY=" + json.dumps({
                              "lifecycle_counts": lifecycle_counts,
                              "subscriptions": runtime.health.subscriptions,
                              "acks": len(runtime.health.acknowledgements),
                              "startup_common_target": len(set(last_opens)) == 1,
                              "startup_target": startup_target,
                              "cooldown_remaining_ms": None if runtime._rest_cooldown_until is None else max(0, int((runtime._rest_cooldown_until - runtime.monotonic()) * 1000)),
                          }, sort_keys=True), flush=True)

                          while not runtime.health.boundary_diagnostics:
                              if task.done():
                                  await task
                                  raise RuntimeError("application exited before first post-cooldown boundary diagnostic")
                              await asyncio.sleep(0.1)

                          diag = runtime.health.boundary_diagnostics[-1]
                          rows = transport_rows[transport_start:]
                          candles = [r for r in rows if r["type"] == "candleSnapshot"]
                          l2 = [r for r in rows if r["type"] == "l2Book"]
                          print("ACTIVE_DIAG_TRANSPORT=" + json.dumps({
                              "candle": latency_summary(candles),
                              "l2": latency_summary(l2),
                              "all_post_count": len(rows),
                          }, sort_keys=True), flush=True)
                          print("ACTIVE_DIAG_CANDLE_CALLS=" + json.dumps(candles, sort_keys=True), flush=True)
                          print("ACTIVE_DIAG_BOUNDARY=" + json.dumps(asdict(diag), sort_keys=True), flush=True)
                          print("ACTIVE_DIAG_REPORTS=" + json.dumps([
                              {
                                  "boundary_open_time_ms": r.boundary_open_time_ms,
                                  "evaluation_mode": r.evaluation_mode.value,
                                  "disposition": r.disposition.value,
                                  "scanner_run_count": r.scanner_run_count,
                                  "evaluated_market_count": len(r.evaluated_market_ids),
                                  "failure_count": len(r.failures),
                                  "failure_reasons": [f"{f.stage}:{f.error_type}:{f.reason}" for f in r.failures],
                              }
                              for r in reports[-5:]
                          ], sort_keys=True), flush=True)
                          print("ACTIVE_DIAG_HEALTH=" + json.dumps({
                              "recoverable": sorted(runtime.health.recoverable_markets),
                              "failed": sorted(runtime.health.failed_markets),
                              "nonrecoverable": sorted(runtime.health.nonrecoverable_markets),
                              "callback_failures": [asdict(item) for item in runtime.health.callback_failures[-10:]],
                              "ws_candidate_rejections": [asdict(item) for item in runtime.health.ws_candidate_rejections[-10:]],
                          }, sort_keys=True), flush=True)
                  finally:
                      shutdown.set()
                      try:
                          await asyncio.wait_for(task, timeout=20)
                      except Exception:
                          task.cancel()
                          await asyncio.gather(task, return_exceptions=True)

          asyncio.run(main())
          PY

      - name: Final exact identity
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "23f48c64448bd2089ceece0cd1b3038b9b6e6ff1"
          echo "DIAG_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "DIAG_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
