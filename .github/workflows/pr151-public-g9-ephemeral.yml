name: PR151 exact-head public G9 boundary trace

on:
  push:
    branches:
      - ops/pr151-public-g9-16d967c7-20260903

permissions:
  contents: read

jobs:
  public-g9-boundary-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 16d967c7d27f21dcc95c146f45d2873b3e496752
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock

      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "G9_TRACE_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "G9_TRACE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Hashed locked install
        run: |
          python -m venv /tmp/trader-assist-v0-g9trace-venv
          /tmp/trader-assist-v0-g9trace-venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-v0-g9trace-venv/bin/python -m pip install -e . --no-deps --no-build-isolation
          /tmp/trader-assist-v0-g9trace-venv/bin/python scripts/check_dependency_lock.py --verify-installed
          /tmp/trader-assist-v0-g9trace-venv/bin/python -m pip check

      - name: Trace first post-ACTIVE boundary
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/trader-assist-v0-g9trace-venv/bin/python - <<'PY'
          import asyncio
          import json
          import tempfile
          import time
          from collections import Counter
          from collections.abc import Awaitable
          from dataclasses import asdict
          from datetime import UTC, datetime
          from decimal import Decimal
          from pathlib import Path

          from scripts.build_multi_asset_registry_seed import build_seed
          from trader_assist_v0.multi_asset_shadow import production
          from trader_assist_v0.multi_asset_shadow.bootstrap import BoundaryReport
          from trader_assist_v0.multi_asset_shadow.hyperliquid_public import HyperliquidPublicClient, OfficialMetadataValidator
          from trader_assist_v0.multi_asset_shadow.models import MarketLifecycle
          from trader_assist_v0.multi_asset_shadow.notification_engine import WebhookConfig, WebhookDeliveryAdapter, WebhookResponse
          from trader_assist_v0.multi_asset_shadow.planning import CostModel
          from trader_assist_v0.multi_asset_shadow.registry import MarketRegistryManager
          from trader_assist_v0.multi_asset_shadow.runtime import BoundaryMode, classify_retained_boundary

          CANDIDATE = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          MAX_SECONDS = 1500.0

          class NoNetworkNotificationClient:
              def post(self, **_):
                  return WebhookResponse(204)

          async def main():
              with tempfile.TemporaryDirectory(prefix="trade-os-g9trace-") as td:
                  state = Path(td) / "state"
                  production.THREE_SETUP_STATE_ROOT = state
                  production.THREE_SETUP_EVIDENCE_STORE_PATH = state / "evidence.sqlite"
                  production.THREE_SETUP_REGISTRY_ROOT = state / "registry"
                  production.THREE_SETUP_CLOSED_BAR_STORE_PATH = state / "closed-bars.sqlite"

                  client = HyperliquidPublicClient()
                  seed = build_seed(
                      version=f"g9trace-{CANDIDATE[:12]}",
                      observed_at=datetime.now(UTC),
                      client=client,
                  )
                  assert len(seed.markets) == 20
                  registry = MarketRegistryManager(
                      production.THREE_SETUP_REGISTRY_ROOT,
                      metadata_validator=OfficialMetadataValidator(client),
                  )
                  registry.stage(seed)
                  registry.request_apply(seed.version)
                  adapter = WebhookDeliveryAdapter(
                      client=NoNetworkNotificationClient(),
                      config=WebhookConfig(url="https://example.invalid/no-network"),
                  )
                  config = production.ThreeSetupProductionConfig(
                      release_sha=CANDIDATE,
                      evidence_store_path=production.THREE_SETUP_EVIDENCE_STORE_PATH,
                      registry_root=production.THREE_SETUP_REGISTRY_ROOT,
                      closed_bar_store_path=production.THREE_SETUP_CLOSED_BAR_STORE_PATH,
                      cost_model=CostModel("g9trace", Decimal(), Decimal(), Decimal("2")),
                      acknowledgement_timeout_seconds=30,
                      notification_poll_seconds=1,
                  )
                  application = production.compose_three_setup_application(
                      config=config,
                      notification_adapter=adapter,
                      public_client=client,
                  )
                  runtime = application.bootstrap.runtime
                  reports = []
                  real_callback = runtime.on_finalized_5m
                  real_process = runtime.process_cohort_boundary
                  assert real_callback is not None
                  post_active_boundary = asyncio.Event()
                  trace_records = []

                  async def observe(bar, mode):
                      value = real_callback(bar, mode)
                      report = await value if isinstance(value, Awaitable) else value
                      assert isinstance(report, BoundaryReport)
                      reports.append(report)
                      print("G9_CALLBACK=" + json.dumps({
                          "boundary": report.boundary_open_time_ms,
                          "mode": report.evaluation_mode.value,
                          "scanner": report.scanner_run_count,
                          "strategy_markets": len(report.evaluated_market_ids),
                          "failures": [asdict(item) for item in report.failures],
                      }, sort_keys=True, separators=(",", ":")), flush=True)
                      return report

                  async def traced_process(boundary):
                      active = registry.active()
                      selected = runtime.selected_markets()
                      lifecycle = Counter(m.lifecycle.value for m in selected)
                      classes = Counter()
                      last_opens = {}
                      if active is not None:
                          for market in selected:
                              last_opens[market.identity.market_id] = application.bootstrap.data_authority.store.last_open(market.identity.market_id)
                              classes[classify_retained_boundary(
                                  store=application.bootstrap.data_authority.store,
                                  registry=registry,
                                  market_id=market.identity.market_id,
                                  boundary_open_ms=boundary,
                                  captured_version=active.version,
                                  captured_hash=active.content_hash,
                              ).value] += 1
                      pre = {
                          "boundary": boundary,
                          "lifecycle": dict(sorted(lifecycle.items())),
                          "classes": dict(sorted(classes.items())),
                          "data_ready": runtime.health.data_ready,
                          "ack": len(runtime.health.acknowledgements),
                          "last_open_min": min((v for v in last_opens.values() if v is not None), default=None),
                          "last_open_max": max((v for v in last_opens.values() if v is not None), default=None),
                      }
                      print("G9_BARRIER_PRE=" + json.dumps(pre, sort_keys=True, separators=(",", ":")), flush=True)
                      error = None
                      try:
                          await real_process(boundary)
                      except Exception as exc:
                          error = type(exc).__name__ + ":" + str(exc)
                          raise
                      finally:
                          diag = None
                          if runtime.health.boundary_diagnostics and runtime.health.boundary_diagnostics[-1].boundary_open_ms == boundary:
                              diag = asdict(runtime.health.boundary_diagnostics[-1])
                          post = {
                              "boundary": boundary,
                              "pre": pre,
                              "diagnostic": diag,
                              "callback_failures": [asdict(item) for item in runtime.health.callback_failures[-5:]],
                              "report_count": len(reports),
                              "error": error,
                          }
                          trace_records.append(post)
                          print("G9_BARRIER_POST=" + json.dumps(post, sort_keys=True, separators=(",", ":")), flush=True)
                          if lifecycle.get(MarketLifecycle.ACTIVE.value, 0) == 20:
                              post_active_boundary.set()

                  runtime.on_finalized_5m = observe
                  runtime.process_cohort_boundary = traced_process
                  shutdown = asyncio.Event()
                  task = asyncio.create_task(application.run(shutdown))
                  started = time.monotonic()
                  final = None
                  try:
                      while time.monotonic() - started < MAX_SECONDS:
                          if task.done():
                              try:
                                  await task
                                  reason = "APPLICATION_EXITED_NORMALLY"
                              except Exception as exc:
                                  reason = "APPLICATION_EXITED:" + type(exc).__name__ + ":" + str(exc)
                              final = {"reason": reason}
                              break
                          try:
                              await asyncio.wait_for(post_active_boundary.wait(), timeout=30)
                              final = {
                                  "reason": "FIRST_POST_ACTIVE_BOUNDARY_OBSERVED",
                                  "elapsed_seconds": round(time.monotonic() - started, 1),
                                  "trace": trace_records[-1] if trace_records else None,
                                  "reports": [{
                                      "boundary": r.boundary_open_time_ms,
                                      "mode": r.evaluation_mode.value,
                                      "scanner": r.scanner_run_count,
                                      "strategy_markets": len(r.evaluated_market_ids),
                                      "failure_count": len(r.failures),
                                  } for r in reports[-3:]],
                                  "failed_markets": sorted(runtime.health.failed_markets),
                                  "recoverable_markets": sorted(runtime.health.recoverable_markets),
                                  "nonrecoverable_markets": sorted(runtime.health.nonrecoverable_markets),
                                  "ws_candidate_rejections": len(runtime.health.ws_candidate_rejections),
                                  "public_data_only": True,
                                  "notification_network_disabled": True,
                                  "shadow_order_submitted": False,
                              }
                              break
                          except TimeoutError:
                              print("G9_PROGRESS=" + json.dumps({
                                  "elapsed_seconds": round(time.monotonic() - started, 1),
                                  "data_ready": runtime.health.data_ready,
                                  "ws_phase": runtime.health.ws_phase,
                                  "ack": len(runtime.health.acknowledgements),
                                  "diagnostic_count": len(runtime.health.boundary_diagnostics),
                                  "report_count": len(reports),
                              }, sort_keys=True, separators=(",", ":")), flush=True)
                      if final is None:
                          final = {
                              "reason": "MAX_TRACE_WINDOW",
                              "elapsed_seconds": round(time.monotonic() - started, 1),
                              "trace_count": len(trace_records),
                              "report_count": len(reports),
                          }
                      print("G9_TRACE_FINAL=" + json.dumps(final, sort_keys=True, separators=(",", ":")), flush=True)
                  finally:
                      shutdown.set()
                      try:
                          await asyncio.wait_for(task, timeout=15)
                      except Exception:
                          task.cancel()
                          await asyncio.gather(task, return_exceptions=True)

          asyncio.run(main())
          PY

      - name: Final exact identity
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "16d967c7d27f21dcc95c146f45d2873b3e496752"
          echo "G9_TRACE_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "G9_TRACE_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git status --short
