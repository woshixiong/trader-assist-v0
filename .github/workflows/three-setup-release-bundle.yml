name: Three Setup exact-release bundle

"on":
  workflow_dispatch:
    inputs:
      release_sha:
        description: Frozen reviewed product release SHA
        type: string
        required: true
        default: 1d8e8ca08f4f526f72b2253acf3c9a71defdbe7b
      release_tree:
        description: Frozen reviewed product release tree
        type: string
        required: true
        default: 2daee287c155fa33e8af5894f3825d7eddb09e70

permissions:
  contents: read

jobs:
  build-release-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_SHA: 1d8e8ca08f4f526f72b2253acf3c9a71defdbe7b
      RELEASE_TREE: 2daee287c155fa33e8af5894f3825d7eddb09e70
      INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
      INPUT_RELEASE_TREE: ${{ inputs.release_tree }}
      CONTROL_HEAD: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/release/src:${{ github.workspace }}/release
    steps:
      - name: Validate frozen inputs
        id: inputs
        run: |
          set -euo pipefail
          [[ "$INPUT_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_RELEASE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$INPUT_RELEASE_SHA" = "$RELEASE_SHA"
          test "$INPUT_RELEASE_TREE" = "$RELEASE_TREE"
      - name: Initialize runtime build root
        id: build_root
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set and non-empty}"
          : "${GITHUB_ENV:?GITHUB_ENV must be set and non-empty}"

          case "${GITHUB_RUN_ID:-}" in
            ''|*[!0-9]*)
              printf '%s\n' 'GITHUB_RUN_ID must contain only ASCII digits' >&2
              exit 1
              ;;
          esac
          case "${GITHUB_RUN_ATTEMPT:-}" in
            ''|*[!0-9]*)
              printf '%s\n' 'GITHUB_RUN_ATTEMPT must contain only ASCII digits' >&2
              exit 1
              ;;
          esac

          case "$RUNNER_TEMP" in
            *$'\n'*|*$'\r'*)
              printf '%s\n' 'RUNNER_TEMP must not contain line breaks' >&2
              exit 1
              ;;
          esac

          if ! printf 'BUILD_ROOT=%s/l0-release-%s-%s\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >> "$GITHUB_ENV"; then
            printf '%s\n' 'Failed to persist BUILD_ROOT through GITHUB_ENV' >&2
            exit 1
          fi
      - name: Checkout exact control HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout historical product release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: release
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify separate checkout identities
        id: identity
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$CONTROL_HEAD"
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C release rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          test -z "$(git -C release status --porcelain=v1 --untracked-files=all)"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact release dependency closure
        id: dependencies
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import platform
          import sys
          assert platform.system() == 'Linux'
          assert platform.machine() == 'x86_64'
          assert sys.implementation.name == 'cpython'
          assert sys.version_info[:2] == (3, 12)
          PY
          test ! -e "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT/wheels" "$BUILD_ROOT/package-source"
          python -m venv "$BUILD_ROOT/venv"
          "$BUILD_ROOT/venv/bin/python" -m pip install --require-hashes \
            -r "$GITHUB_WORKSPACE/release/requirements-dev.lock"
          "$BUILD_ROOT/venv/bin/python" -m pip install --require-hashes \
            --no-deps --only-binary=:all: \
            -r "$GITHUB_WORKSPACE/release/requirements-nautilus-pilot.lock"
          # The checker requires project metadata; build outside the clean release checkout.
          git -C release archive "$RELEASE_SHA" | tar -x -C "$BUILD_ROOT/package-source"
          "$BUILD_ROOT/venv/bin/python" -m pip install --no-deps --no-build-isolation \
            "$BUILD_ROOT/package-source"
          "$BUILD_ROOT/venv/bin/python" -B release/scripts/check_dependency_lock.py \
            --verify-pilot-installed
          "$BUILD_ROOT/venv/bin/python" -m pip check
          "$BUILD_ROOT/venv/bin/python" -m pip download --require-hashes \
            --no-deps --only-binary=:all: \
            -r "$GITHUB_WORKSPACE/release/requirements-nautilus-pilot.lock" \
            -d "$BUILD_ROOT/wheels"
          "$BUILD_ROOT/venv/bin/python" -B - <<'PY'
          import hashlib
          import os
          import re
          from importlib.metadata import version
          from pathlib import Path
          from scripts.check_dependency_lock import PILOT_WHEEL_SHA256
          from scripts.three_setup_shadow_preflight import verify_host_prerequisites
          assert version('nautilus-trader') == '2.0.0rc5'
          files = list((Path(os.environ['BUILD_ROOT']) / 'wheels').iterdir())
          assert len(files) == 1
          wheel = files[0]
          assert wheel.is_file() and not wheel.is_symlink()
          assert re.fullmatch(r'nautilus_trader-2\.0\.0rc5-cp312-cp312-[A-Za-z0-9_.]+\.whl', wheel.name)
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == PILOT_WHEEL_SHA256
          verify_host_prerequisites(wheel)
          PY
      - name: Build complete launch identity and bundle
        id: builders
        run: |
          set -euo pipefail
          case "${GITHUB_RUN_ID:-}" in
            ''|*[!0-9]*)
              printf '%s\n' 'GITHUB_RUN_ID must contain only ASCII digits' >&2
              exit 1
              ;;
          esac
          case "${GITHUB_RUN_ATTEMPT:-}" in
            ''|*[!0-9]*)
              printf '%s\n' 'GITHUB_RUN_ATTEMPT must contain only ASCII digits' >&2
              exit 1
              ;;
          esac
          run_id="l0-${RELEASE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          wheels=("$BUILD_ROOT"/wheels/*.whl)
          test "${#wheels[@]}" = 1
          test ! -e "$BUILD_ROOT/launch"
          test ! -e "$BUILD_ROOT/bundle"
          cd "$GITHUB_WORKSPACE/release"
          "$BUILD_ROOT/venv/bin/python" -B "$GITHUB_WORKSPACE/release/scripts/build_multi_asset_registry_seed.py" \
            --version "$run_id" --output "$BUILD_ROOT/registry-seed.json" \
            --launch-output "$BUILD_ROOT/launch" --expected-sha "$RELEASE_SHA" \
            --expected-tree "$RELEASE_TREE" --run-id "$run_id"
          "$BUILD_ROOT/venv/bin/python" -B "$GITHUB_WORKSPACE/release/scripts/build_three_setup_shadow_deployment_bundle.py" \
            --root "$GITHUB_WORKSPACE/release" --expected-sha "$RELEASE_SHA" \
            --expected-tree "$RELEASE_TREE" --rc5-wheel "${wheels[0]}" \
            --launch-artifacts "$BUILD_ROOT/launch" --output "$BUILD_ROOT/bundle" \
            | tee "$BUILD_ROOT/builder-stdout.txt"
      - name: Bootstrap generated verifier and finalize anchors
        id: finalize
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/control/src:$GITHUB_WORKSPACE/control" \
            "$BUILD_ROOT/venv/bin/python" -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path
          from scripts.build_three_setup_shadow_deployment_bundle import handoff_anchors
          from trader_assist_v0.contracts.common import canonical_json_bytes

          root = Path(os.environ['BUILD_ROOT'])
          bundle = root / 'bundle'
          script = bundle / 'remote-qualification.sh'
          assert stat.S_IMODE(script.stat().st_mode) == 0o750
          script_text = script.read_text()
          prefix = 'PYTHONPATH="$BUNDLE_ROOT/payload/src:$BUNDLE_ROOT/payload" python3.12 -B '
          candidates = [line for line in script_text.splitlines()
                        if '"$BUNDLE_ROOT/payload/scripts/verify_exact_release.py"' in line]
          assert len(candidates) == 1, 'expected exactly one historical verifier command'
          command = candidates[0]
          expected = (prefix + '  "$BUNDLE_ROOT/payload/scripts/verify_exact_release.py"'
              '   --root "$BUNDLE_ROOT/payload" --verify-staged "$BUNDLE_ROOT/release-manifest.json"'
              '   --expected-release-sha "$EXPECTED_RELEASE_SHA"'
              '   --expected-release-tree "$EXPECTED_RELEASE_TREE"'
              '   --expected-manifest-digest "$EXPECTED_RELEASE_MANIFEST_CANONICAL_DIGEST"')
          assert command == expected, 'unexpected historical verifier structure'
          bootstrap = r'''(
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          temp_identity="$(python3.12 -I -B - <<'PY_TEMP_PARENT'
          import os, sys
          from pathlib import Path
          assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
          parent = Path(os.environ.get('TMPDIR') or '/tmp').resolve(strict=True)
          bundle = Path(os.environ['BUNDLE_ROOT']).resolve(strict=True)
          assert parent.is_dir() and bundle.is_dir()
          assert parent != bundle and not parent.is_relative_to(bundle), 'temporary parent inside bundle'
          assert not any(c in str(parent) for c in '\n\r\t'), 'unsafe temporary parent'
          identity = parent.stat()
          print(f'{parent}\t{identity.st_dev}\t{identity.st_ino}')
          PY_TEMP_PARENT
          )"
          IFS=$'\t' read -r temp_parent temp_device temp_inode <<< "$temp_identity"
          verification_dir="$(mktemp -d "$temp_parent/trade-os-verify.XXXXXXXXXX")"
          cleanup_verification() {
            status=$?
            trap - EXIT HUP INT TERM
            if ! rm -rf -- "$verification_dir"; then
              echo 'verification runtime cleanup failed' >&2
              if [[ "$status" == 0 ]]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup_verification EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3.12 -I -B - "$temp_parent" "$temp_device" "$temp_inode" "$verification_dir" <<'PY_TEMP_ALLOCATION'
          import sys
          from pathlib import Path
          parent_name, device, inode, allocation_name = sys.argv[1:]
          parent = Path(parent_name).resolve(strict=True)
          allocation = Path(allocation_name).resolve(strict=True)
          bundle = Path(__import__('os').environ['BUNDLE_ROOT']).resolve(strict=True)
          identity = parent.stat()
          assert str(parent) == parent_name and parent.is_dir()
          assert (identity.st_dev, identity.st_ino) == (int(device), int(inode)), 'temporary parent changed'
          assert parent != bundle and not parent.is_relative_to(bundle)
          assert allocation.is_dir() and allocation.parent == parent, 'allocation parent mismatch'
          assert str(allocation) == allocation_name, 'allocation canonical path mismatch'
          assert allocation.name.startswith('trade-os-verify.')
          assert allocation != bundle and not allocation.is_relative_to(bundle), 'allocation inside bundle'
          PY_TEMP_ALLOCATION
          verification_venv="$verification_dir/venv"
          python3.12 -I -B -m venv "$verification_venv"
          "$verification_venv/bin/python" -I -m pip --isolated install --require-hashes --no-cache-dir \
            -r "$BUNDLE_ROOT/payload/requirements-runtime.lock"
          '''
          invocation = command.replace('python3.12 -B ', '"$verification_venv/bin/python" -B ', 1)
          replacement = bootstrap + invocation + '\n)'
          assert script_text.count(command) == 1
          manifest_path = bundle / 'bundle-manifest.json'
          manifest = json.loads(manifest_path.read_bytes())
          entries = [item for item in manifest['files'] if item['path'] == 'remote-qualification.sh']
          assert len(entries) == 1, 'expected exactly one script manifest entry'
          data = script_text.replace(command, replacement, 1).encode()
          script.write_bytes(data)
          entries[0].update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
          manifest_path.write_bytes(canonical_json_bytes(manifest))
          assert stat.S_IMODE(script.stat().st_mode) == 0o750
          anchors = handoff_anchors(bundle)
          assert len(anchors) == 5
          assert anchors['EXPECTED_RELEASE_SHA'] == os.environ['RELEASE_SHA']
          assert anchors['EXPECTED_RELEASE_TREE'] == os.environ['RELEASE_TREE']
          for key, value in anchors.items():
              assert re.fullmatch(r'[0-9a-f]{40}' if key in (
                  'EXPECTED_RELEASE_SHA', 'EXPECTED_RELEASE_TREE') else r'[0-9a-f]{64}', value)
          with (root / 'finalized-anchors.env').open('x') as record:
              record.write(''.join(f'{key}={value}\n' for key, value in anchors.items()))
          PY
      - name: Capture five independent handoff anchors
        id: anchors
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/control/src:$GITHUB_WORKSPACE/control" \
            "$BUILD_ROOT/venv/bin/python" -B - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import re
          from pathlib import Path
          from scripts.build_three_setup_shadow_deployment_bundle import handoff_anchors
          root = Path(os.environ['BUILD_ROOT'])
          expected = handoff_anchors(root / 'bundle')
          assert len(expected) == 5
          captured = {}
          lines = (root / 'finalized-anchors.env').read_text().splitlines()
          assert len(lines) == 5
          for line in lines:
              key, separator, value = line.partition('=')
              assert separator and key in expected and key not in captured
              assert re.fullmatch(r'[0-9a-f]{40}' if key in (
                  'EXPECTED_RELEASE_SHA', 'EXPECTED_RELEASE_TREE') else r'[0-9a-f]{64}', value)
              captured[key] = value
          assert list(captured) == list(expected)
          assert captured == expected
          assert captured['EXPECTED_RELEASE_SHA'] == os.environ['RELEASE_SHA']
          assert captured['EXPECTED_RELEASE_TREE'] == os.environ['RELEASE_TREE']
          handoff = root / 'handoff'
          handoff.mkdir()
          anchors = ''.join(f'{key}={captured[key]}\n' for key in expected)
          (handoff / 'anchors.env').write_text(anchors)
          release = Path(os.environ['GITHUB_WORKSPACE']) / 'release'
          provenance = {
              'control_head': os.environ['CONTROL_HEAD'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'release_sha': os.environ['RELEASE_SHA'],
              'release_tree': os.environ['RELEASE_TREE'],
              'python': platform.python_version(),
              'system': platform.system(), 'machine': platform.machine(),
              'nautilus_trader': '2.0.0rc5',
              'lock_sha256': {name: hashlib.sha256((release / name).read_bytes()).hexdigest()
                              for name in ('requirements-runtime.lock', 'requirements-dev.lock',
                                           'requirements-nautilus-pilot.lock')},
              'authority': 'ARTIFACT_ONLY_NO_DEPLOYMENT_RUNTIME_SERVICE_AUTHORITY',
          }
          (handoff / 'provenance.json').write_text(json.dumps(provenance, sort_keys=True) + '\n')
          PY
      - name: Verify bundle and create transport archive
        id: transport
        run: |
          set -euo pipefail
          "$BUILD_ROOT/venv/bin/python" -B - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import re
          import stat
          import tarfile
          from pathlib import Path
          from scripts.build_three_setup_shadow_deployment_bundle import _reject_secret, handoff_anchors
          from scripts.verify_exact_release import verify_staged_release

          root = Path(os.environ['BUILD_ROOT'])
          bundle = root / 'bundle'
          handoff = root / 'handoff'

          def regular(path):
              assert stat.S_ISREG(path.lstat().st_mode), f'non-regular file: {path}'
              _reject_secret(path)
              # anchors.env is textual metadata too; use the existing conservative matcher.
              if path.suffix == '.env':
                  from scripts.build_three_setup_shadow_deployment_bundle import SECRET_VALUE
                  data = path.read_bytes()
                  assert not SECRET_VALUE.search(data)
                  assert (b'-----BEGIN ' + b'PRIVATE KEY-----') not in data
                  assert b'https://discord.com/api/webhooks/' not in data
              return path.read_bytes()

          def files_under(directory):
              assert stat.S_ISDIR(directory.lstat().st_mode)
              paths = {}
              for path in directory.rglob('*'):
                  mode = path.lstat().st_mode
                  if stat.S_ISDIR(mode):
                      continue
                  paths[path.relative_to(directory).as_posix()] = regular(path)
              return paths

          def verify_bundle(directory):
              files = files_under(directory)
              manifest = json.loads(files['bundle-manifest.json'])
              assert manifest['release_sha'] == os.environ['RELEASE_SHA']
              assert manifest['release_tree'] == os.environ['RELEASE_TREE']
              assert manifest['activation'] == 'DEFAULT_OFF' and manifest['service'] == 'STOPPED'
              listed = set()
              for entry in manifest['files']:
                  assert set(entry) == {'path', 'sha256', 'size'}
                  name = entry['path']
                  assert isinstance(name, str) and name and not name.startswith('/')
                  assert '\\' not in name and all(p not in ('', '.', '..') for p in name.split('/'))
                  assert not any(p in ('.git', '__pycache__', 'venv', '.venv', '.cache')
                                 for p in name.split('/'))
                  assert name not in listed and name != 'bundle-manifest.json'
                  listed.add(name)
                  assert type(entry['size']) is int and len(files[name]) == entry['size']
                  assert re.fullmatch(r'[0-9a-f]{64}', entry['sha256'])
                  assert hashlib.sha256(files[name]).hexdigest() == entry['sha256']
              assert set(files) == listed | {'bundle-manifest.json'}
              assert not any(Path(name).name in ('qualification.json', 'three-setup-activation-permit')
                             for name in files)
              release = json.loads(files['release-manifest.json'])
              verify_staged_release(directory / 'payload', release,
                  expected_release_sha=os.environ['RELEASE_SHA'],
                  expected_release_tree=os.environ['RELEASE_TREE'],
                  expected_manifest_digest=manifest['release_manifest_digest'])
              config = json.loads(files['config/three-setup-shadow.json'])
              assert 'cost_model' in config and config['cost_model'] is None
              assert config['qualification_digest'] == 'NOT_QUALIFIED'
              env_lines = files['config/three-setup-shadow.env'].decode().splitlines()
              values = {}
              for line in env_lines:
                  key, separator, value = line.partition('=')
                  assert separator and key not in values
                  values[key] = value
              assert values['TRADER_ASSIST_V0_THREE_SETUP_ENABLE'] == '0'
              assert values['TRADER_ASSIST_V0_THREE_SETUP_MODE'] == 'DISABLED'
              assert stat.S_IMODE((directory / 'remote-qualification.sh').stat().st_mode) == 0o750
              return files

          bundle_files = verify_bundle(bundle)
          handoff_files = files_under(handoff)
          assert set(handoff_files) == {'anchors.env', 'provenance.json'}
          expected = handoff_anchors(bundle)
          assert handoff_files['anchors.env'].decode() == ''.join(
              f'{key}={value}\n' for key, value in expected.items())
          provenance = json.loads(handoff_files['provenance.json'])
          assert provenance['release_sha'] == os.environ['RELEASE_SHA']
          assert provenance['release_tree'] == os.environ['RELEASE_TREE']
          assert provenance['control_head'] == os.environ['CONTROL_HEAD']
          all_files = {f'bundle/{name}': data for name, data in bundle_files.items()}
          all_files.update({f'handoff/{name}': data for name, data in handoff_files.items()})
          archive_path = root / 'three-setup-release-bundle.tar.gz'
          # tar/gzip normalize metadata while preserving the builder's executable modes.
          with archive_path.open('xb') as raw, gzip.GzipFile(fileobj=raw, mode='wb',
                                                           filename='', mtime=0) as compressed:
              with tarfile.open(fileobj=compressed, mode='w', format=tarfile.USTAR_FORMAT) as archive:
                  for directory in (bundle, handoff):
                      for path in (directory, *sorted(directory.rglob('*'))):
                          info = archive.gettarinfo(str(path), arcname=path.relative_to(root).as_posix())
                          assert info.isdir() or info.isfile()
                          info.uid = info.gid = info.mtime = 0
                          info.uname = info.gname = ''
                          if info.isfile():
                              with path.open('rb') as data:
                                  archive.addfile(info, data)
                          else:
                              archive.addfile(info)
          extracted = root / 'round-trip'
          extracted.mkdir()
          with tarfile.open(archive_path, 'r:gz') as archive:
              names = set()
              regular_names = set()
              directories = {'bundle', 'handoff'}
              for name in all_files:
                  directories.update(str(parent) for parent in Path(name).parents if str(parent) != '.')
              for member in archive.getmembers():
                  name = member.name
                  assert name not in names
                  names.add(name)
                  assert name and not name.startswith('/') and '\\' not in name
                  assert all(p not in ('', '.', '..') for p in name.split('/'))
                  assert member.uid == member.gid == member.mtime == 0
                  assert member.isfile() or member.isdir()
                  if member.isfile():
                      assert name in all_files
                      regular_names.add(name)
                      stream = archive.extractfile(member)
                      assert stream is not None and stream.read() == all_files[name]
                      if name == 'bundle/remote-qualification.sh':
                          assert member.mode == 0o750
                  else:
                      assert name in directories
              assert regular_names == set(all_files)
              assert names == set(all_files) | directories
              archive.extractall(extracted, filter='data')
          assert verify_bundle(extracted / 'bundle') == bundle_files
          assert files_under(extracted / 'handoff') == handoff_files
          PY
      - name: Disposable final transport verify and install
        id: simulation
        run: |
          set -euo pipefail
          python3.12 -I -B - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import re
          import signal
          import stat
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          KEYS = (
              'EXPECTED_RELEASE_SHA', 'EXPECTED_RELEASE_TREE',
              'EXPECTED_RELEASE_MANIFEST_CANONICAL_DIGEST',
              'EXPECTED_BUNDLE_MANIFEST_SHA256', 'EXPECTED_REMOTE_QUALIFICATION_SHA256',
          )
          DESTINATIONS = (
              Path('/opt/trader-assist-v0'), Path('/etc/trader-assist-v0'),
              Path('/var/lib/trader-assist-v0'),
              Path('/etc/systemd/system/trader-assist-v0-three-setup.service'),
          )
          UNIT = 'trader-assist-v0-three-setup.service'


          def run(args, **kwargs):
              return subprocess.run(args, check=True, text=True, **kwargs)


          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def absent(path):
              return not path.exists() and not path.is_symlink()


          def inactive():
              result = subprocess.run(['systemctl', 'is-active', UNIT], text=True,
                                      capture_output=True, check=False)
              assert result.returncode in (3, 4) and result.stdout.strip() in (
                  'inactive', 'unknown'), 'service active or service-manager query failed'


          def identity(kind):
              result = subprocess.run(['getent', kind, 'traderassist'], text=True,
                                      capture_output=True, check=False)
              assert result.returncode in (0, 2), 'identity lookup failed'
              return result.stdout.strip() if result.returncode == 0 else None


          def extract(archive, stage):
              with tarfile.open(archive, 'r:gz') as tar:
                  names = {}
                  for member in tar.getmembers():
                      name = member.name.rstrip('/') if member.isdir() else member.name
                      assert name and not name.startswith('/') and '\\' not in name
                      assert all(p not in ('', '.', '..') for p in name.split('/'))
                      assert name not in names, 'duplicate archive member'
                      assert member.isfile() or member.isdir(), 'unsafe archive type'
                      assert not member.mode & 0o7000, 'privileged archive mode'
                      assert name.split('/')[0] in ('bundle', 'handoff')
                      names[name] = member.isdir()
                  assert names.get('bundle') and names.get('handoff')
                  for name in names:
                      for parent in Path(name).parents:
                          if str(parent) != '.':
                              assert names.get(parent.as_posix()), 'invalid archive parent'
              run(['tar', '--same-permissions', '--no-same-owner', '-xzf', str(archive),
                   '-C', str(stage)])
              assert {p.name for p in stage.iterdir()} == {'bundle', 'handoff'}
              for path in stage.rglob('*'):
                  assert stat.S_ISREG(path.lstat().st_mode) or stat.S_ISDIR(path.lstat().st_mode)
              assert {p.name for p in (stage / 'handoff').iterdir()} == {'anchors.env', 'provenance.json'}
              script = stage / 'bundle/remote-qualification.sh'
              assert stat.S_ISREG(script.lstat().st_mode)
              assert stat.S_IMODE(script.lstat().st_mode) == 0o750
              lines = (stage / 'handoff/anchors.env').read_text().splitlines()
              assert len(lines) == 5
              anchors = {}
              for key, line in zip(KEYS, lines, strict=True):
                  name, separator, value = line.partition('=')
                  assert separator and name == key and name not in anchors
                  assert re.fullmatch(r'[0-9a-f]{40}' if key in KEYS[:2] else r'[0-9a-f]{64}', value)
                  anchors[name] = value
              assert anchors[KEYS[0]] == os.environ['RELEASE_SHA']
              assert anchors[KEYS[1]] == os.environ['RELEASE_TREE']
              provenance = json.loads((stage / 'handoff/provenance.json').read_bytes())
              assert provenance['control_head'] == os.environ['CONTROL_HEAD']
              assert provenance['release_sha'] == anchors[KEYS[0]]
              assert provenance['release_tree'] == anchors[KEYS[1]]
              assert digest(stage / 'bundle/bundle-manifest.json') == anchors[KEYS[3]]
              assert digest(script) == anchors[KEYS[4]]
              manifest = json.loads((stage / 'bundle/bundle-manifest.json').read_bytes())
              assert manifest['release_sha'] == anchors[KEYS[0]]
              assert manifest['release_tree'] == anchors[KEYS[1]]
              assert manifest['release_manifest_digest'] == anchors[KEYS[2]]
              assert manifest['activation'] == 'DEFAULT_OFF' and manifest['service'] == 'STOPPED'
              return anchors


          def cleanup(install_owned, user_record, group_record, scratch):
              errors = []
              def attempt(action):
                  try:
                      action()
                  except BaseException as exc:
                      errors.append(str(exc))
              if install_owned:
                  for path in DESTINATIONS:
                      attempt(lambda path=path: run(['sudo', '-n', 'rm', '-rf', '--', str(path)]))
                  for path in DESTINATIONS:
                      if not absent(path):
                          errors.append(f'cleanup left {path}')
              for kind, record, command in (
                  ('passwd', user_record, 'userdel'), ('group', group_record, 'groupdel'),
              ):
                  if record:
                      def remove(kind=kind, record=record, command=command):
                          current = identity(kind)
                          if current is None:
                              return
                          assert current == record, 'simulation identity changed'
                          run(['sudo', '-n', command, 'traderassist'])
                          assert identity(kind) is None, 'simulation identity remains'
                      attempt(remove)
              if scratch:
                  attempt(lambda: run(['sudo', '-n', 'rm', '-rf', '--', str(scratch)]))
                  if not absent(scratch):
                      errors.append('simulation scratch remains')
              return errors


          def main():
              assert platform.system() == 'Linux' and platform.machine() == 'x86_64'
              assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
              assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
              assert Path('/etc/os-release').read_text().find('VERSION_ID="24.04"') >= 0
              root = Path(os.environ['BUILD_ROOT']).resolve(strict=True)
              archive = root / 'three-setup-release-bundle.tar.gz'
              original_digest = digest(archive)
              parent = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              assert parent.is_dir() and not parent.is_relative_to(root)
              env = {k: v for k, v in os.environ.items() if not k.startswith('PIP_') and k not in (
                  'PYTHONPATH', 'PYTHONHOME', 'VIRTUAL_ENV', 'TRADER_ASSIST_V0_DEPLOYMENT_AUTHORIZED')}
              env['PYTHONDONTWRITEBYTECODE'] = '1'
              scratch = None
              user_record = group_record = None
              install_owned = False
              status = 0
              def interrupted(signum, frame):
                  raise SystemExit(128 + signum)
              for signum in (signal.SIGHUP, signal.SIGINT, signal.SIGTERM):
                  signal.signal(signum, interrupted)
              # Cleanup is registered by this try/finally before scratch, identity or install mutation.
              try:
                  scratch = Path(tempfile.mkdtemp(prefix='trade-os-simulation.', dir=parent))
                  assert scratch.parent == parent and not scratch.is_relative_to(root)
                  stage = scratch / 'staging'
                  stage.mkdir()
                  temp = scratch / 'tmp'
                  temp.mkdir()
                  env['TMPDIR'] = str(temp)
                  anchors = extract(archive, stage)
                  bundle = stage / 'bundle'
                  script = bundle / 'remote-qualification.sh'
                  expected = [anchors[key] for key in KEYS[:4]]
                  # Fail on missing capabilities; never provision OS packages or global dependencies.
                  run(['python3.12', '-I', '-B', '-c',
                       'import math, hashlib, venv, ensurepip, sys; '
                       'assert sys.implementation.name == "cpython" and sys.version_info[:2] == (3, 12)'], env=env)
                  run(['python3.12', '-I', '-m', 'pip', '--version'], env=env)
                  run(['python3.12', '-I', '-m', 'venv', str(scratch / 'probe')], env=env)
                  run([str(scratch / 'probe/bin/python'), '-I', '-m', 'pip', '--version'], env=env)
                  privileged_env = ['sudo', '-n', 'env', '-i', f'PATH={env["PATH"]}',
                                    f'TMPDIR={temp}', 'PYTHONDONTWRITEBYTECODE=1']
                  run(privileged_env + ['python3.12', '-I', '-c',
                                       'import sys; assert sys.executable == ' + repr(sys.executable)], env=env)
                  for path in DESTINATIONS:
                      assert absent(path), f'preexisting deployment path: {path}'
                  assert identity('passwd') is None and identity('group') is None, 'preexisting traderassist identity'
                  inactive()
                  def execute(mode):
                      assert digest(script) == anchors[KEYS[4]]
                      assert digest(bundle / 'bundle-manifest.json') == anchors[KEYS[3]]
                      command = ['bash', str(script), mode, *expected]
                      if mode == '--install':
                          command = privileged_env + ['TRADER_ASSIST_V0_DEPLOYMENT_AUTHORIZED=YES'] + command
                      result = run(command, env=env, capture_output=True)
                      for marker in ('BUNDLE_HASH_VERIFY=PASS', 'STAGED_RELEASE_VERIFY=PASS',
                                     'PREINSTALL_VERIFY=PASS; SERVICE=STOPPED; ACTIVATION=DEFAULT_OFF'):
                          assert marker in result.stdout, f'missing {marker}'
                      if mode == '--install':
                          assert 'INSTALL_VERIFIED=PASS; SERVICE=STOPPED; ACTIVATION=DEFAULT_OFF' in result.stdout
                      assert not list(temp.glob('trade-os-verify.*')), 'verification temp leak'
                      print(f'DISPOSABLE_{mode[2:].upper()}=PASS', flush=True)
                  execute('--verify')
                  run(['sudo', '-n', 'groupadd', '--system', 'traderassist'])
                  group_record = identity('group')
                  assert group_record
                  run(['sudo', '-n', 'useradd', '--system', '--no-create-home',
                       '--gid', 'traderassist', '--shell', '/usr/sbin/nologin', 'traderassist'])
                  user_record = identity('passwd')
                  assert user_record
                  install_owned = True
                  print('AUTHORITY=DISPOSABLE_CI_SIMULATION_ONLY_NO_TARGET_DEPLOYMENT', flush=True)
                  execute('--install')
                  # The installed interpreter checks exact staged release and dependency closure.
                  installed = DESTINATIONS[0]
                  target_env = privileged_env + [f'PYTHONPATH={installed}/src:{installed}']
                  run(target_env + [str(installed / 'venv/bin/python'), '-B',
                                   str(installed / 'scripts/verify_exact_release.py'), '--root', str(installed),
                                   '--verify-staged', str(installed / 'three-setup-release-manifest.json'),
                                   '--expected-release-sha', expected[0], '--expected-release-tree', expected[1],
                                   '--expected-manifest-digest', expected[2]], env=env)
                  run(target_env + [str(installed / 'venv/bin/python'), '-B',
                                   str(installed / 'scripts/check_dependency_lock.py'),
                                   '--verify-target-runtime-installed', '--staged-source', str(installed / 'src'),
                                   '--pip-check-with', sys.executable], env=env)
                  # Read root-owned config/identity with the same interpreter, without runtime qualification.
                  postcheck = r'''
          import json, sys
          from pathlib import Path
          bundle = Path(sys.argv[1])
          installed = Path('/opt/trader-assist-v0')
          config_root = Path('/etc/trader-assist-v0')
          assert not (config_root / 'three-setup-activation-permit').exists()
          for name in ('three-setup-shadow.json', 'three-setup-shadow.env'):
              assert (config_root / name).read_bytes() == (bundle / 'config' / name).read_bytes()
          config = json.loads((config_root / 'three-setup-shadow.json').read_bytes())
          assert config['cost_model'] is None and config['qualification_digest'] == 'NOT_QUALIFIED'
          values = dict(line.split('=', 1) for line in (config_root / 'three-setup-shadow.env').read_text().splitlines())
          assert values['TRADER_ASSIST_V0_THREE_SETUP_ENABLE'] == '0'
          assert values['TRADER_ASSIST_V0_THREE_SETUP_MODE'] == 'DISABLED'
          assert (installed / 'three-setup-release-manifest.json').read_bytes() == (bundle / 'release-manifest.json').read_bytes()
          for name in ('requirements-runtime.lock', 'requirements-nautilus-pilot.lock'):
              assert (installed / name).read_bytes() == (bundle / 'payload' / name).read_bytes()
          assert 'include-system-site-packages = false' in (installed / 'venv/pyvenv.cfg').read_text()
          assert Path('/etc/systemd/system/trader-assist-v0-three-setup.service').read_bytes() == (bundle / 'payload/deploy/p4a/systemd/trader-assist-v0-three-setup.service').read_bytes()
          if (bundle / 'identity').is_dir():
              identity_files = {p.relative_to(bundle / 'identity'): p.read_bytes() for p in (bundle / 'identity').rglob('*') if p.is_file()}
              state = Path('/var/lib/trader-assist-v0/three-setup-shadow')
              assert {p.relative_to(state): p.read_bytes() for p in state.rglob('*') if p.is_file()} == identity_files
          '''
                  run(privileged_env + ['python3.12', '-I', '-B', '-c', postcheck, str(bundle)], env=env)
                  inactive()
                  assert not list(temp.glob('trade-os-verify.*'))
              except BaseException as exc:
                  status = exc.returncode if isinstance(exc, subprocess.CalledProcessError) else (
                      exc.code if isinstance(exc, SystemExit) and isinstance(exc.code, int) else 1)
                  status = status or 1
                  print(f'disposable simulation failed: {exc}', file=sys.stderr)
                  if isinstance(exc, subprocess.CalledProcessError):
                      print(exc.stdout or '', file=sys.stderr)
                      print(exc.stderr or '', file=sys.stderr)
              finally:
                  for signum in (signal.SIGHUP, signal.SIGINT, signal.SIGTERM):
                      signal.signal(signum, signal.SIG_IGN)
                  errors = cleanup(install_owned, user_record, group_record, scratch)
                  try:
                      assert digest(archive) == original_digest, 'transport archive changed'
                  except BaseException as exc:
                      errors.append(str(exc))
                  if errors:
                      print('\n'.join(errors), file=sys.stderr)
                      status = status or 1
              if status:
                  raise SystemExit(status)
              # This digest is an integrity checkpoint, not release/handoff authority.
              (root / 'simulation-archive.sha256').write_text(original_digest + '\n')
              print('DISPOSABLE_E2E=PASS; CLEANUP=PASS; ARCHIVE_UNCHANGED=PASS')


          main()
          PY
      - name: Terminal identity and handoff summary
        id: terminal
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$CONTROL_HEAD"
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C release rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          test -z "$(git -C release status --porcelain=v1 --untracked-files=all)"
          python -I -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['BUILD_ROOT'])
          record = root / 'simulation-archive.sha256'
          assert record.is_file(), 'disposable simulation checkpoint missing'
          assert hashlib.sha256((root / 'three-setup-release-bundle.tar.gz').read_bytes()).hexdigest() == record.read_text().strip()
          PY
          {
            printf 'CONTROL_HEAD=%s\nRUN_ID=%s\nRUN_ATTEMPT=%s\n' "$CONTROL_HEAD" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'ARTIFACT=three-setup-release-%s-%s-%s\n' "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            cat "$BUILD_ROOT/handoff/anchors.env"
            printf 'Artifact PASS grants no deployment/runtime/service authority.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only verified transport archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-setup-release-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_ROOT }}/three-setup-release-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
