name: Nautilus pilot E3 CI

on:
  pull_request:
  push:
    branches: [feature/e3-nautilus-thin-host-domain-contract]

permissions:
  contents: read

jobs:
  nautilus-pilot:
    runs-on: ubuntu-24.04
    env:
      NAUTILUS_PILOT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-nautilus-pilot.lock
      - name: Exact hashed pilot environment
        run: |
          python -m venv /tmp/trader-assist-e3-venv
          /tmp/trader-assist-e3-venv/bin/python -m pip install \
            --require-hashes -r requirements-dev.lock
          /tmp/trader-assist-e3-venv/bin/python -m pip install \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements-nautilus-pilot.lock
          /tmp/trader-assist-e3-venv/bin/python -m pip install \
            -e . --no-deps --no-build-isolation
      - name: Dependency closure and integrity
        run: |
          /tmp/trader-assist-e3-venv/bin/python scripts/check_dependency_lock.py \
            --verify-pilot-installed
          /tmp/trader-assist-e3-venv/bin/python -m pip check
      - name: Runtime and pilot dependency audits
        run: |
          /tmp/trader-assist-e3-venv/bin/pip-audit --strict -r requirements-runtime.lock
          /tmp/trader-assist-e3-venv/bin/pip-audit --strict \
            -r requirements-nautilus-pilot.lock
      - name: Exact environment and rc5 identity
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          /tmp/trader-assist-e3-venv/bin/python - <<'PY'
          import platform
          import sys
          from importlib.metadata import version

          assert sys.version_info[:2] == (3, 12), sys.version
          assert platform.machine() == "x86_64", platform.machine()
          assert version("nautilus-trader") == "2.0.0rc5"
          print(f"OS={platform.system()} ARCH={platform.machine()} PYTHON={platform.python_version()}")
          print(f"NAUTILUS_TRADER={version('nautilus-trader')}")
          PY
      - name: Ruff
        run: |
          /tmp/trader-assist-e3-venv/bin/ruff check \
            src/trader_assist_v0/nautilus_pilot \
            scripts/check_dependency_lock.py \
            tests/test_nautilus_pilot_contracts.py \
            tests/test_nautilus_pilot_version_contract.py
      - name: Mypy
        run: |
          /tmp/trader-assist-e3-venv/bin/mypy \
            src/trader_assist_v0/nautilus_pilot \
            scripts/check_dependency_lock.py
      - name: Focused E3 contracts and exact-version integration
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/e3-focused-tests.txt
          /tmp/trader-assist-e3-venv/bin/pytest -q \
            tests/test_nautilus_pilot_contracts.py \
            | tee -a /tmp/e3-focused-tests.txt
          /tmp/trader-assist-e3-venv/bin/pytest -q \
            tests/test_nautilus_pilot_version_contract.py \
            | tee -a /tmp/e3-focused-tests.txt
          {
            echo "FOCUSED_TEST_RESULT=PASS"
            echo "CANONICAL_CLOSEDBAR_REVALIDATED=YES"
            echo "TIMESTAMP_GEOMETRY_EXACT=YES"
            echo "DECIMAL_OHLCV_LOSSLESS=YES"
            echo "STRATEGY_PACKAGE_VERSION_SELECTOR_FAIL_CLOSED=YES"
            echo "IMPORTABLE_STRATEGY_CONFIG_PUBLIC_SURFACE=YES"
            echo "OFFICIAL_BACKTEST_CUSTOM_DATA_DISPATCH=YES"
            echo "UNCHANGED_PROJECT_KERNEL_USED=YES"
            echo "DIRECT_VS_NAUTILUS_MEDIATED_RESULT=IDENTICAL_FOR_REPRESENTATIVE_CURRENT_FIXTURE"
            echo "PILOT_OUTPUT_NONAUTHORITATIVE_AND_REBUILDABLE=YES"
            echo "ORDER_ACCOUNT_EXECUTION_CALLS=NONE"
          } >> /tmp/e3-focused-tests.txt
      - name: Diff check
        run: git diff --check
      - name: Build E3 evidence artifact
        shell: bash
        run: |
          mkdir -p /tmp/e3-evidence
          {
            echo "E3_CLAIM=THIN_HOST_DOMAIN_CONTRACT_INTEGRATION_ACCEPTED"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TREE=$(git rev-parse HEAD^{tree})"
            echo "OS=$(uname -s)"
            echo "ARCH=$(uname -m)"
            /tmp/trader-assist-e3-venv/bin/python -c \
              'import platform; print("PYTHON=" + platform.python_version())'
            /tmp/trader-assist-e3-venv/bin/python -c \
              'from importlib.metadata import version; print("NAUTILUS_TRADER=" + version("nautilus-trader"))'
            sha256sum requirements-runtime.lock requirements-dev.lock \
              requirements-nautilus-pilot.lock
          } > /tmp/e3-evidence/environment.txt
          cp /tmp/e3-focused-tests.txt /tmp/e3-evidence/focused-tests.txt
      - name: Upload E3 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nautilus-pilot-e3-evidence-${{ github.sha }}
          path: /tmp/e3-evidence
          if-no-files-found: error
