name: V0 contracts CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Schema drift
        run: python scripts/export_schemas.py --check
      - name: Secret scan
        run: python scripts/scan_secrets.py .
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src scripts
      - name: Tests
        run: pytest -q
