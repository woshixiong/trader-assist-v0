name: V0 contracts CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Dependency lock
        run: python scripts/check_dependency_lock.py && python -m pip check
      - name: Runtime dependency audit
        run: pip-audit --strict -r requirements-runtime.lock
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Schema drift
        run: python scripts/export_schemas.py --check
      - name: Secret scan
        run: python scripts/scan_secrets.py .
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src scripts
      - name: Tests
        run: pytest -q
