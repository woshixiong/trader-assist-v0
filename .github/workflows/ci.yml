name: V0 contracts CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      VENV: /tmp/trader-assist-v0-venv
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock
      - name: Hashed locked install
        run: |
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --require-hashes -r requirements-dev.lock
          "$VENV/bin/python" -m pip install -e . --no-deps --no-build-isolation
      - name: Dependency closure and integrity
        run: |
          "$VENV/bin/python" scripts/check_dependency_lock.py --verify-installed
          "$VENV/bin/python" -m pip check
      - name: Runtime dependency audit
        run: "$VENV/bin/pip-audit" --strict -r requirements-runtime.lock
      - name: Compile
        run: "$VENV/bin/python" -m compileall -q src scripts tests
      - name: Schema drift
        run: "$VENV/bin/python" scripts/export_schemas.py --check
      - name: Secret scan
        run: "$VENV/bin/python" scripts/scan_secrets.py .
      - name: Ruff
        run: "$VENV/bin/ruff" check .
      - name: Mypy
        run: "$VENV/bin/mypy" src scripts
      - name: Tests
        run: "$VENV/bin/pytest" -q
      - name: Diff check
        run: git diff --check
