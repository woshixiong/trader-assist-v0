[build-system]
requires = ["hatchling==1.30.1", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "trader-assist-v0"
version = "0.0.0"
description = "Contract-first Trader Assist V0 bootstrap"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.4",
  "websockets==16.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.167.0",
  "jsonschema==4.26.0",
  "mypy==1.16.1",
  "pytest==8.4.1",
  "ruff==0.12.2",
  "pip-audit==2.9.0",
]
nautilus-pilot = [
  "nautilus-trader==2.0.0rc5",
]
operator = [
  "fastapi==0.141.1",
  "starlette==1.7.0",
  "jinja2==3.1.6",
  "uvicorn==0.54.0",
]
decision-model-typesafe = [
  "typesafe-sdk==0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trader_assist_v0"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "TID251"]

[tool.ruff.lint.per-file-ignores]
"!src/trader_assist_v0/multi_asset_shadow/production.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"trader_assist_v0.multi_asset_shadow.data.ClosedBarStore" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.data.MultiAssetDataAuthority" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.hyperliquid_public.HyperliquidPublicClient" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.hyperliquid_public.OfficialMetadataValidator" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.hyperliquid_public.HyperliquidPublicPlanningAdapter" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.hyperliquid_public.HyperliquidRestOneMinuteProvider" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.runtime.MultiAssetPublicRuntime" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.cohort_finality.Closed5mCohortFinality" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use E4 composition." }
"trader_assist_v0.multi_asset_shadow.bootstrap.MultiAssetProductionBootstrap.compose" = { msg = "TS5A: legacy Three Setup production owner is prohibited; use compose_e4." }

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["trader_assist_v0"]
