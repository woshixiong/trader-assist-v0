#:schema https://developers.openai.com/codex/config-schema.json
# Trade OS V5 candidate repo defaults.
# Static configuration does not prove local CLI/model/permission qualification.
model = "gpt-6-sol"
model_reasoning_effort = "medium"
service_tier = "default"
model_verbosity = "low"
model_reasoning_summary = "none"
web_search = "disabled"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Keep outbound network outside the default workspace sandbox. The on-request
# approval path may authorize eligible network operations; V5 activation still
# requires runtime qualification of the GitHub lifecycle path.
[sandbox_workspace_write]
network_access = false

[agents]
enabled = true
# This limits optional spawned child threads, excluding the primary thread.
# Governance default is zero children; one child is allowed only when explicitly
# justified and runtime-verifiable.
max_concurrent_threads_per_session = 1

[agents.explorer]
description = "Optional read-only bounded repository explorer; never required."
config_file = "./agents/explorer.toml"

[agents.code_reviewer]
description = "Optional read-only implementation reviewer; never final independent acceptance."
config_file = "./agents/code-reviewer.toml"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '/usr/bin/python3 "$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.py"'
timeout = 10
statusMessage = "Checking protected Git operations"
